<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liminal</title>
<meta name="description" content="Tu IA en español, privada y a precio justo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liminal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
:root{
  /* Layout: two-pane shell. A gray sidebar (administración, proyectos, carpetas, chats) beside one conversation column (max 46rem) with the composer docked at the bottom; below 860px the sidebar becomes a drawer. The interface is light and dark gray only; macOS red, yellow and green carry meaning: green = on, healthy, paid; yellow = in progress, near a limit, points; red = errors, stop, destructive. */
  --bg:#F5F5F7; --side:#EBEBEE; --raised:#FFFFFF; --sunk:#EDEDF0;
  --ink:#1D1D1F; --ink-2:#48484A; --ink-3:#6E6E73;
  --line:#D8D8DD; --line-2:#C4C4C9;
  --hover:rgba(0,0,0,.05); --sel:rgba(0,0,0,.08); --seg-on:#FFFFFF; --bubble:#E8E8ED;
  --red:#FF5F57; --yellow:#FEBC2E; --green:#28C840;
  --red-text:#C4302B; --yellow-text:#8A5A00; --green-text:#1A7F2E;
  --red-tint:#FFE6E4; --yellow-tint:#FFF3D9; --green-tint:#DEF5E3;
  --code-bg:#1C1C1E; --code-ink:#E5E5EA; --code-head:#2C2C2E; --code-muted:#98989D;
  --scrim:rgba(0,0,0,.38); --shadow:0 18px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.07);
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Onest","Segoe UI",system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Onest","Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1C1E; --side:#151517; --raised:#2C2C2E; --sunk:#242426;
    --ink:#F5F5F7; --ink-2:#C7C7CC; --ink-3:#98989D;
    --line:#38383A; --line-2:#48484A;
    --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.1); --seg-on:#3A3A3C; --bubble:#2C2C2E;
    --red-text:#FF7B74; --yellow-text:#FEBC2E; --green-text:#4BD865;
    --red-tint:#3B2321; --yellow-tint:#3A3122; --green-tint:#1F3524;
    --code-bg:#111113; --code-ink:#E5E5EA; --code-head:#1C1C1E; --code-muted:#8E8E93;
    --scrim:rgba(0,0,0,.55); --shadow:0 18px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1C1E; --side:#151517; --raised:#2C2C2E; --sunk:#242426;
  --ink:#F5F5F7; --ink-2:#C7C7CC; --ink-3:#98989D;
  --line:#38383A; --line-2:#48484A;
  --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.1); --seg-on:#3A3A3C; --bubble:#2C2C2E;
  --red-text:#FF7B74; --yellow-text:#FEBC2E; --green-text:#4BD865;
  --red-tint:#3B2321; --yellow-tint:#3A3122; --green-tint:#1F3524;
  --code-bg:#111113; --code-ink:#E5E5EA; --code-head:#1C1C1E; --code-muted:#8E8E93;
  --scrim:rgba(0,0,0,.55); --shadow:0 18px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}.ic.xs{width:13px;height:13px}.ic.lg{width:22px;height:22px}
.ic .f{fill:currentColor;stroke:none}
.grow{flex:1}
.scroll{overflow-y:auto;overscroll-behavior:contain}
.mark{flex:none;fill:currentColor}

/* Sign in */
.auth{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:min(400px,100%);background:var(--raised);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:32px 28px 26px;display:flex;flex-direction:column;gap:18px}
.auth-mark{width:52px;height:52px;color:var(--ink)}
.auth-card h1{margin:0;font-family:var(--font-display);font-weight:650;font-size:1.55rem;letter-spacing:-.02em;line-height:1.2}
.auth-sub{margin:-10px 0 0;color:var(--ink-3)}
.auth form{display:flex;flex-direction:column;gap:14px}
.pw{position:relative}
.pw .input{padding-right:44px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.pw button:hover{background:var(--hover);color:var(--ink)}
.auth-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9em}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink-2)}
.check input{width:17px;height:17px;accent-color:var(--ink);margin:0}
.auth-err{display:flex;gap:9px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:10px;background:var(--red-tint);color:var(--ink);font-size:.9em}
.auth-err .dotc{margin-top:6px}
.btn.block{width:100%;height:44px;font-size:.98em}
.auth-foot{margin:0;text-align:center;font-size:.9em;color:var(--ink-3)}
.auth-note{margin:0;max-width:400px;text-align:center;font-size:.78rem;color:var(--ink-3)}
.dotc{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dotc.g{background:var(--green)}.dotc.y{background:var(--yellow)}.dotc.r{background:var(--red)}

/* Shell */
.app{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;transition:grid-template-columns .22s ease}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
.app.collapsed .sidebar{visibility:hidden}
.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;position:relative}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:45}

/* Sidebar */
.sb-head{display:flex;align-items:center;gap:8px;height:40px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);border-radius:8px}
.brand .mark{width:22px;height:22px}
.wordmark{font-family:var(--font-display);font-weight:650;font-size:1.2rem;letter-spacing:-.02em;line-height:1}
.demo-pill{font-size:.72rem;font-weight:500;color:var(--yellow-text);background:var(--yellow-tint);padding:2px 8px;border-radius:99px}
.sb-close,.sb-collapse{margin-left:auto}
.new-chat{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;border-radius:12px;background:var(--raised);border:1px solid var(--line);font-weight:500;color:var(--ink)}
.new-chat:hover{border-color:var(--line-2)}
.new-chat kbd{margin-left:auto;font:500 .72rem var(--font-ui);color:var(--ink-3)}
.sb-search{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;margin-top:6px;border-radius:10px;color:var(--ink-2);font-size:.92em}
.sb-search:hover{background:var(--hover);color:var(--ink)}
.sb-search.active{background:var(--sel);color:var(--ink);font-weight:500}
.sb-scroll{flex:1;overflow-y:auto;margin:4px -6px 0;padding:0 6px 8px}
.sb-label{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;font-size:.78rem;color:var(--ink-3);font-weight:500}
.sb-label button{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.sb-label button:hover{background:var(--hover);color:var(--ink)}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;min-height:34px;padding:6px 10px;border-radius:9px;color:var(--ink-2);font-size:.92em}
.sb-item:hover{background:var(--hover);color:var(--ink)}
.sb-item.active,.sb-chat.active .sb-item{background:var(--sel);color:var(--ink);font-weight:500}
.sb-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .count{font-size:.8em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.sb-chat{position:relative;display:flex;align-items:center}
.sb-chat .sb-item{padding-right:34px}
.sb-chat .more{position:absolute;right:3px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3);opacity:0}
.sb-chat:hover .more,.sb-chat.active .more,.sb-chat .more:focus-visible{opacity:1}
.sb-chat .more:hover{background:var(--hover);color:var(--ink)}
@media (hover:none){.sb-chat .more{opacity:.75}}
.folder-kids{margin-left:14px;padding-left:8px;border-left:1px solid var(--line)}
.chev-rot{transition:transform .15s}
.open>.chev-rot{transform:rotate(90deg)}
.sb-group{padding:10px 10px 2px;font-size:.74rem;color:var(--ink-3)}
.sb-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.usage-mini{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:10px;text-align:left}
.usage-mini:hover{background:var(--hover)}
.usage-mini .um-top{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.usage-mini .um-sub{font-size:.74rem;color:var(--ink-3)}
.meter{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.sidebar .meter{background:var(--line)}
.meter>i{display:block;height:100%;background:var(--green);border-radius:inherit}
.meter.warn>i{background:var(--yellow)}
.meter.hot>i{background:var(--red)}
.profile{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left}
.profile:hover{background:var(--hover)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:600;flex:none}
.profile .pn{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.92em;line-height:1.25}
.profile .pp{display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--ink-3)}
.profile .pp .ic{color:var(--yellow-text)}
.role{font-size:.68rem;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--sel);color:var(--ink-2)}

/* Top bar */
.topbar{display:flex;align-items:center;gap:6px;min-height:56px;flex:none;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.model-btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-radius:10px;min-width:0}
.model-btn:hover,.model-btn[aria-expanded="true"]{background:var(--hover)}
.model-btn .mb-name{font-weight:600}
.model-btn .mb-sub{color:var(--ink-3);font-size:.88em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.92em;color:var(--ink-2)}
.tb-title .crumb-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36ch;color:var(--ink)}
.tb-title .crumb-p{color:var(--ink-3);border-radius:6px;padding:2px 4px;white-space:nowrap}
.tb-title .crumb-p:hover{color:var(--ink);background:var(--hover)}
.tb-title .crumb-sep{color:var(--line-2)}
.pill-toggle{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);font-size:.88em}
.pill-toggle:hover{border-color:var(--line-2);color:var(--ink)}
.pill-toggle.on{background:var(--ink);color:var(--bg);border-color:transparent}

/* Views */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding-block:12px 40px}
.home-inner{width:100%;max-width:46rem;margin:auto 0;display:flex;flex-direction:column;gap:22px}
.hero{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.hero .mark{width:60px;height:60px;color:var(--ink);overflow:visible}
.mk-l{animation:mkl .9s cubic-bezier(.2,.75,.2,1) both}
.mk-b{animation:mkb .9s cubic-bezier(.2,.75,.2,1) .08s both}
.mk-7{animation:mk7 .9s cubic-bezier(.2,.75,.2,1) .16s both}
@keyframes mkl{from{transform:translate(-90px,90px)}}
@keyframes mkb{from{transform:translate(0,-110px)}}
@keyframes mk7{from{transform:translate(110px,-60px)}}
@media (prefers-reduced-motion:reduce){.mk-l,.mk-b,.mk-7{animation:none}}
.greet{font-family:var(--font-display);font-weight:650;font-size:clamp(1.75rem,4.2vw,2.35rem);line-height:1.15;margin:0;letter-spacing:-.025em;text-wrap:balance}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:.92em}
.notice b{display:block;font-weight:600}
.notice span{color:var(--ink-2)}
.notice .ic{margin-top:2px;color:var(--ink-2)}
.notice.warn{background:var(--yellow-tint)}
.notice.warn .ic{color:var(--yellow-text)}
.notice .btn{margin-left:auto;align-self:center}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mode-card{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:14px;border:1px solid var(--line);background:transparent;text-align:left;min-width:0}
.mode-card:hover{background:var(--raised);border-color:var(--line-2)}
.mode-card .ic{color:var(--ink-2);margin-bottom:6px}
.mode-card b{font-weight:600;font-size:.95em}
.mode-card span{font-size:.84em;color:var(--ink-3);line-height:1.4}
.mode-card.on{border-color:var(--ink);background:var(--raised)}
.mode-card.on .ic{color:var(--ink)}

/* Composer */
.composer{background:var(--raised);border:1px solid var(--line-2);border-radius:22px;padding:12px 10px 8px 16px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.composer:focus-within{border-color:var(--ink-3)}
.composer textarea{border:0;outline:0;resize:none;background:transparent;width:100%;min-height:26px;max-height:220px;line-height:1.5;padding:2px 2px 4px;font-size:1em}
.composer textarea::placeholder{color:var(--ink-3)}
.composer-bar{display:flex;align-items:center;gap:6px;margin-left:-6px}
.mode-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);font-size:.86em;white-space:nowrap}
.mode-chip:hover{border-color:var(--line-2);color:var(--ink)}
.mode-chip.set{background:var(--sel);border-color:transparent;color:var(--ink)}
.send{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;transition:transform .1s}
.send:active{transform:scale(.94)}
.send:disabled{background:var(--sunk);color:var(--ink-3);cursor:default}
.att-row{display:flex;flex-wrap:wrap;gap:6px}
.att{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 6px 4px 10px;border-radius:10px;background:var(--sunk);font-size:.84em}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.att button{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3)}
.att button:hover{background:var(--hover);color:var(--ink)}
.fineprint{margin:8px 0 0;text-align:center;font-size:.76rem;color:var(--ink-3)}

/* Thread */
.thread{flex:1;min-height:0}
.thread-inner{max-width:46rem;margin:0 auto;padding-block:12px 28px;display:flex;flex-direction:column;gap:30px}
.app.compact .thread-inner{gap:18px}
.dock{flex:none;padding-block:0 12px}
.dock-inner{max-width:46rem;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.msg{min-width:0}
.msg.user{align-self:flex-end;max-width:min(85%,36rem);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bubble{background:var(--bubble);padding:10px 15px;border-radius:20px 20px 6px 20px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-files{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.msg.bot{display:flex;flex-direction:column;gap:8px}
.bot-head{display:flex;align-items:center;gap:8px;font-size:.82em;color:var(--ink-3);flex-wrap:wrap}
.bot-head b{color:var(--ink);font-weight:600}
.gen{position:relative;margin:10px 0 0;border-radius:16px;overflow:hidden;background:var(--sunk);max-width:420px;border:1px solid var(--line)}
.gen-art{overflow:hidden}
.gen.image .gen-art{aspect-ratio:1/1}
.gen.video .gen-art{aspect-ratio:16/9}
.gen-art svg{display:block;width:100%;height:100%}
.gen.video .gen-art svg{animation:genpan 6s ease-in-out infinite alternate;transform-origin:center}
@keyframes genpan{from{transform:scale(1)}to{transform:scale(1.12) translate(-3%,-2%)}}
.gen-play{position:absolute;left:50%;top:calc(50% - 16px);transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff}
.gen-tag{position:absolute;right:10px;top:10px;font-size:.75em;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff}
.gen figcaption{font-size:.78em;color:var(--ink-3);padding:8px 12px}
@media (prefers-reduced-motion:reduce){.gen.video .gen-art svg{animation:none}}
.composer-bar{flex-wrap:wrap;row-gap:6px}
.att.rich{padding:5px 6px 5px 6px;gap:8px;max-width:260px}
.att.rich img{width:30px;height:30px;border-radius:7px;object-fit:cover;flex:none}
.att.rich .ic{flex:none}
.att-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.att-t b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-t small{color:var(--ink-3);font-size:.86em;white-space:nowrap}
.att.err .att-t small{color:var(--red-text)}
.tool-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 10px;border-radius:99px;background:var(--sel);color:var(--ink);font-size:.86em;white-space:nowrap}
.tool-chip button{width:24px;height:24px;border-radius:99px;display:grid;place-items:center;color:var(--ink-3)}
.tool-chip button:hover{background:var(--hover);color:var(--ink)}
.rec-bar{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--red-tint);font-size:.9em}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:recpulse 1s ease-in-out infinite alternate}
@keyframes recpulse{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.rec-dot{animation:none}}
.sources{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:.82em;color:var(--ink-3)}

.md{line-height:1.68;overflow-wrap:anywhere}

.doc-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--raised)}

.doc-card .doc-t{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:2px}
.doc-card .doc-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.doc-card .doc-btns{display:flex;gap:6px;flex-wrap:wrap}
.md pre{margin:0;padding:12px 14px;overflow-x:auto}
.md pre code{background:none;padding:0;font-size:.86em;line-height:1.6;color:inherit}
.caret{display:inline-block;width:8px;height:1.05em;vertical-align:-2px;margin-left:2px;background:var(--ink-2);border-radius:2px;animation:blink 1s steps(2) infinite}

.msg-actions{display:flex;gap:2px;margin-left:-6px}

.msg.user:hover .msg-actions,.msg.user .msg-actions:focus-within{opacity:1}
@media (hover:none){.msg.user .msg-actions{opacity:1}}
.act{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.act:hover{background:var(--hover);color:var(--ink)}

/* Loading: three gray dots that rise in turn, and the text a soft gray shine passes over, like Claude */
.pulse{display:inline-flex;align-items:center;justify-content:center;gap:3px;flex:none;height:12px;color:var(--ink-3)}
.pulse i{flex:none;width:4.5px;height:4.5px;border-radius:50%;background:currentColor;opacity:.4;animation:lmdot 1.2s ease-in-out infinite}
.pulse i:nth-child(2){animation-delay:.16s}.pulse i:nth-child(3){animation-delay:.32s}
.thinking-live .pulse{gap:4px}.thinking-live .pulse i{width:6px;height:6px}
@keyframes lmdot{0%,70%,100%{opacity:.4;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
.shimmer,.tool-step.start>.t,.tool-step.start>button{background:linear-gradient(90deg,var(--ink-3) 0%,var(--ink-3) 38%,var(--ink) 50%,var(--ink-3) 62%,var(--ink-3) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:lmshine 2.2s linear infinite}

/* Project */
.project{flex:1;min-height:0}

.plan-card .pc-t{flex:1;min-width:200px}
.plan-card b{display:block;font-size:1.05em}
.plan-card span{color:var(--ink-2);font-size:.9em}
.price{font-family:var(--font-display);font-weight:650;font-size:1.6rem;letter-spacing:-.02em;line-height:1}
.price small{font-family:var(--font-ui);font-weight:400;font-size:.85rem;color:var(--ink-3)}
.meters{display:flex;flex-direction:column;gap:16px;padding:14px 0 4px}
.mt-top{display:flex;justify-content:space-between;gap:10px;font-size:.9em;margin-bottom:6px}
.mt-top b{font-weight:500}
.mt-top span{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.mt-sub{font-size:.78rem;color:var(--ink-3);margin-top:5px}
.tbl-wrap{overflow-x:auto;margin-top:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:.88em;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:500;color:var(--ink-3);padding:8px 14px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl .num{text-align:right}
.tbl td.user b{display:flex;align-items:center;gap:6px;font-weight:500}
.tbl td.user span{display:block;font-size:.88em;color:var(--ink-3)}
.points-hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:18px}
.points-hero .big{font-family:var(--font-display);font-weight:650;font-size:3rem;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.points-hero .ic{color:var(--yellow-text);align-self:center}
.copy-field{display:flex;gap:8px}
.copy-field .input{font-family:var(--font-mono);font-size:.88em}
.steps{margin:6px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.code-chip{font-family:var(--font-mono);font-weight:500;background:var(--sunk);padding:2px 8px;border-radius:6px}
.status{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--sunk);margin-top:16px}
.status .grow{font-size:.92em}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9em;z-index:90;max-width:calc(100vw - 32px);box-shadow:var(--shadow);animation:toastin .18s ease}
@keyframes toastin{from{opacity:0;transform:translate(-50%,6px)}}

/* Responsive */
.only-mobile{display:none!important}
@media (min-width:861px){.sb-close{display:none}}
@media (max-width:860px){.sb-collapse{display:none}}
@media (hover:none){.new-chat kbd{display:none}}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .app.collapsed .sidebar{visibility:visible}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:50;transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-right:0}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .only-mobile{display:grid!important}
  .only-desktop{display:none!important}
  .tb-title{display:none}
  .model-btn{margin-right:auto}
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .proj-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .model-btn .mb-sub{display:none}
  .pill-toggle span{display:none}
  .pill-toggle{width:36px;padding:0;justify-content:center}
  .home{padding-block:4px 24px}
  .home-inner{gap:18px}
  .hero .mark{width:48px;height:48px}
  .mode-card{padding:12px}
  .auth-card{padding:26px 20px 22px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .tile .tv{font-size:1.45rem}
  .modal.settings{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;width:100%}
  .set-nav{flex-direction:row;overflow-x:auto;padding:10px;gap:6px;border-right:0;border-bottom:1px solid var(--line)}
  .set-nav-title{display:none}
  .set-tab{width:auto;flex:none;white-space:nowrap}
  .set-head{padding-left:20px}
  .set-body{padding:4px 20px 24px}
  .theme-opts{gap:8px}
}

/* Live conversation */
.voice{position:fixed;inset:0;z-index:85;background:var(--bg);display:flex;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .18s ease}
.v-wrap{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;min-height:0}
.v-top{width:100%;display:flex;align-items:center;gap:10px}
.v-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--sunk);color:var(--ink-2);font-size:.85em;font-weight:500;white-space:nowrap}
.v-time{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:.85em;font-weight:500}
.v-lock{display:inline-flex;color:var(--ink-3)}
.v-orb{--lv:0;position:relative;width:min(232px,56vw,34vh);aspect-ratio:1;margin-top:auto;border-radius:50%;display:grid;place-items:center;flex:none;-webkit-tap-highlight-color:transparent}
.v-orb:focus-visible{outline-offset:6px;border-radius:50%}
.v-orb>.o1,.v-orb>.o2,.v-orb>.o3,.v-orb>.ring{position:absolute;inset:0;border-radius:50%;transition:transform .18s ease-out}
.v-orb .o1{background:var(--hover);transform:scale(calc(.86 + var(--lv) * .14))}
.v-orb .o2{background:var(--sel);transform:scale(calc(.72 + var(--lv) * .16))}
.v-orb .o3{background:var(--raised);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.08);transform:scale(calc(.58 + var(--lv) * .05))}
.v-orb .ring{border:2px solid var(--line);transform:scale(calc(.66 + var(--lv) * .05))}
.v-orb[data-phase="listening"] .ring,.v-orb[data-phase="speaking"] .ring,.v-orb[data-phase="typing"] .ring{border-color:var(--green)}
.v-orb[data-phase="muted"] .ring{border-color:var(--red)}
.v-orb[data-phase="thinking"] .ring,.v-orb[data-phase="starting"] .ring{border-color:transparent;border-top-color:var(--yellow);border-width:3px;transform:scale(.66);animation:vspin 1.1s linear infinite}
@keyframes vspin{from{transform:scale(.66) rotate(0)}to{transform:scale(.66) rotate(360deg)}}
.v-center{position:relative;display:flex;align-items:center;gap:6px;color:var(--ink)}
.v-center i{width:7px;border-radius:4px;background:var(--ink);height:calc(10px + var(--lv) * var(--h));transition:height .18s ease-out}
.v-center .mark{width:46px;height:46px}
.v-center .ic{width:32px;height:32px;color:var(--red-text)}
.v-status{margin-top:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.v-status b{display:inline-flex;align-items:center;gap:8px;font-size:1.05em;font-weight:600}
.v-status>span{color:var(--ink-3);font-size:.85em;max-width:34ch}
.dotc.green{background:var(--green)}.dotc.yellow{background:var(--yellow)}.dotc.red{background:var(--red)}
.v-cap{width:100%;margin-top:auto;max-height:min(210px,26vh);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 0}
.v-heard{align-self:flex-end;text-align:right;color:var(--ink-2);margin:0;max-width:85%}
.v-heard:empty,.v-reply:empty{display:none}
.v-reply{margin:0;font-size:1.22em;font-weight:500;line-height:1.4;color:var(--ink-2)}
.v-reply.live{color:var(--ink-3)}
.v-reply .said{color:var(--ink)}
.v-note{margin:10px 0 0;width:100%;padding:10px 12px;border-radius:10px;background:var(--red-tint);color:var(--ink);font-size:.88em}
.v-type{width:100%;display:flex;gap:8px;align-items:center;margin-top:12px}
.v-type .input{height:44px;border-radius:22px;padding:0 16px;background:var(--raised)}
.v-ctl{display:flex;align-items:flex-end;justify-content:center;gap:34px;margin-top:16px}
.v-btn{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-3);font-size:.8em}
.v-btn em{font-style:normal}
.v-btn>span{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink);transition:transform .1s}
.v-btn:active>span{transform:scale(.94)}
.v-btn .ic{width:22px;height:22px}
.v-btn.end>span{width:70px;height:70px;background:var(--red);color:#fff}
.v-btn.on>span{background:var(--red-tint);color:var(--red-text)}
.v-btn[hidden],.v-note[hidden],.v-type[hidden]{display:none}
.send.voice-go{background:var(--ink);color:var(--bg)}
.spoken-tag{display:inline-flex;align-items:center;gap:5px;font-size:.75em;color:var(--ink-3)}
/* Island-style pill: Lithium's progress while you are somewhere else, like the iPhone's Dynamic Island */
.isla{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:88;display:flex;align-items:center;gap:10px;height:40px;max-width:min(380px,calc(100vw - 32px));padding:0 12px 0 12px;border-radius:999px;background:#000;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:islain .32s cubic-bezier(.2,.9,.3,1.15);text-align:left}
.isla[hidden]{display:none}
@keyframes islain{from{opacity:0;transform:translateX(-50%) scale(.82)}}
.isla .mark{width:16px;height:16px;color:#fff}
.i-t{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.i-t b{font-size:.82em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-t small{font-size:.72em;color:#98989D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.i-r{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none;padding-left:4px}
.i-time{font-size:.78em;color:#98989D;font-variant-numeric:tabular-nums}
.i-ring{width:18px;height:18px;transform:rotate(-90deg)}
.i-ring circle{fill:none;stroke-width:3}
.i-ring .bg{stroke:rgba(255,255,255,.18)}.i-ring .fg{stroke:var(--yellow);stroke-linecap:round}
.i-ok{color:var(--green)}.i-no{color:var(--red)}
.i-bars{display:flex;align-items:center;gap:2px;height:14px}
.i-bars i{width:3px;border-radius:2px;background:var(--green);height:5px;animation:ibar .8s ease-in-out infinite alternate}
.i-bars i:nth-child(2){animation-delay:.2s}.i-bars i:nth-child(3){animation-delay:.4s}.i-bars i:nth-child(4){animation-delay:.1s}
.i-bars.thinking i,.i-bars.starting i{background:var(--yellow)}
.i-bars.muted i{background:var(--red);animation:none}
@keyframes ibar{to{height:14px}}
@media (prefers-reduced-motion:reduce){.v-orb .ring,.i-bars i{animation:none}.v-orb>.o1,.v-orb>.o2,.v-orb>.o3,.v-orb>.ring,.v-center i{transition:none}}

/* Side panel: live pages and presentations (artifacts) and the built-in browser */
.app.with-panel{grid-template-columns:280px minmax(0,1fr) minmax(380px,46%)}
.app.collapsed.with-panel{grid-template-columns:0 minmax(0,1fr) minmax(380px,50%)}
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;background:var(--raised);border-left:1px solid var(--line)}
.panel[hidden]{display:none}
.panel.pn-max{position:fixed;inset:0;z-index:80;border-left:0}
.pn-head{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);flex:none}
.pn-head .af-ic{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--sunk);color:var(--ink-2)}
.pn-title{flex:1;min-width:0;display:flex;flex-direction:column}
.pn-title b{font-weight:600;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-title span{font-size:.78em;color:var(--ink-3)}
.pn-tabs{display:flex;align-items:center;gap:4px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line);flex:none}
.pn-body{flex:1;min-height:0;position:relative;background:var(--bg)}
.pn-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.pn-code{position:absolute;inset:0;overflow:auto;margin:0;padding:14px 16px;background:var(--code-bg);color:var(--code-ink);font:12.5px/1.6 var(--font-mono);white-space:pre;tab-size:2}
.pn-form{flex:1;min-width:0;display:flex}
.pn-url{flex:1;min-width:0;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);padding:0 12px;font:inherit;font-size:.88em;color:var(--ink)}
.pn-url:focus{outline:2px solid var(--line-2);outline-offset:0;background:var(--raised)}
.pn-reader{position:absolute;inset:0;overflow:auto;padding:22px 22px 48px}
.pn-reader .md{max-width:42rem;margin:0 auto}
.pn-src{margin:-6px 0 18px!important;font-size:.84em;color:var(--ink-3)}
.pn-note{display:flex;gap:8px;align-items:center;padding:8px 14px;font-size:.8em;color:var(--ink-2);background:var(--sunk);border-bottom:1px solid var(--line);flex:none}
.br-home{max-width:26rem;margin:12vh auto 0;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--ink-2)}
.br-home .ic{color:var(--ink-3)}
.br-home b{color:var(--ink);font-size:1.05em}
.br-home span{font-size:.92em;line-height:1.5}
.icon-btn:disabled,.seg button:disabled{opacity:.35;pointer-events:none}
.app.with-panel .tb-title{display:none}
.app.with-panel .model-btn{margin-right:auto}
.model-btn .mb-name{white-space:nowrap}
@media (min-width:1101px) and (max-width:1500px){.app.with-panel .model-btn .mb-sub{display:none}}
@media (max-width:1100px){
  .app.with-panel{grid-template-columns:280px minmax(0,1fr)}
  .app.collapsed.with-panel{grid-template-columns:0 minmax(0,1fr)}
  .panel{position:fixed;inset:0;z-index:60;border-left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:panelIn .2s ease}
}
@media (max-width:860px){.app.with-panel,.app.collapsed.with-panel{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.hide-sm{display:none!important}}
@keyframes panelIn{from{transform:translateY(14px);opacity:0}}

/* Artifact card in the chat */
.artifact-card{display:flex;align-items:center;gap:12px;width:100%;margin:.2em 0 .9em;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--raised);text-align:left;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.artifact-card:hover{border-color:var(--line-2);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.artifact-card .af-ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:11px;background:var(--sunk);color:var(--ink-2)}
.artifact-card .af-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.artifact-card .af-t b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artifact-card .af-t span{font-size:.8em;color:var(--ink-3)}
.artifact-card .af-go{flex:none;font-size:.84em;font-weight:500;padding:7px 13px;border-radius:9px;background:var(--ink);color:var(--bg)}
.artifact-card.writing .af-go{background:var(--sunk);color:var(--ink-2)}

/* Browsing steps, permission card and notices */
.tools{display:flex;flex-direction:column;gap:5px;margin:2px 0 10px}
.tool-step{display:flex;align-items:center;gap:8px;font-size:.85em;color:var(--ink-2);min-width:0}
.tool-step .t,.tool-step button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.tool-step button{color:var(--ink-2)}
.tool-step button:hover{color:var(--ink);text-decoration:underline}
.tool-step .ic{flex:none;color:var(--ink-3)}
.tool-step .pulse{flex:none;margin:0 2px}
.tool-step.denied,.tool-step.error{color:var(--ink-3)}
.ask-card{margin:6px 0 12px;padding:14px;border:1px solid var(--line-2);border-radius:14px;background:var(--raised);display:flex;flex-direction:column;gap:6px}
.ask-card p{margin:0}
.ask-url{display:flex;align-items:center;gap:6px;font-size:.82em;color:var(--ink-3);word-break:break-all}
.ask-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ask-auto{align-self:flex-start;font-size:.82em;color:var(--ink-2)}
.cut-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 8px;font-size:.85em;color:var(--ink-2)}
.md a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px}
.md a:hover{text-decoration-color:var(--ink)}
button.src{font:inherit;cursor:pointer}
.cmd-tag{display:inline-flex;align-items:center;gap:5px;font-size:.78em;color:var(--ink-3);margin-bottom:4px}

/* Slash commands */
.composer{position:relative}
.slash{position:absolute;left:0;right:0;bottom:calc(100% + 8px);max-height:min(340px,46vh);overflow:auto;background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:30}
.slash-opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left;color:var(--ink)}
.slash-opt[aria-selected="true"],.slash-opt:hover{background:var(--hover)}
.slash-opt .ic{flex:none;color:var(--ink-2)}
.slash-opt code{font:500 .86em var(--font-mono);min-width:8.2em;color:var(--ink);background:none;padding:0}
.slash-opt span{font-size:.86em;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.slash-hint{padding:4px 10px 6px;font-size:.76em;color:var(--ink-3)}

/* Devices and region */
.dev-ic{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--sunk);color:var(--ink-2)}
.dev-row{display:flex;align-items:center;gap:12px;min-width:0}
.host-list{list-style:none;margin:8px 0 0;padding:0}
.host-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92em}
/* ---------- Liminal Dev: the agent beside the project (code, preview, console) ---------- */
.ld{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,42%) minmax(0,1fr);border-top:1px solid var(--line)}
.ld-agent{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}
.ld-ahead{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:46px}
.ld-proj{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-size:.86em}
.ld-proj:hover,.ld-pname:hover{background:var(--hover);color:var(--ink)}
.ld-pname{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;font-weight:600;font-size:.9em;max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ld-thread{flex:1;min-height:0;padding:18px 16px 8px;display:flex;flex-direction:column;gap:18px}
.ld-cwrap{padding:8px 12px 12px}
.ld-composer{border-radius:18px}
.ld-bot{display:flex;flex-direction:column;gap:8px;min-width:0}
.ld-bot .md{min-width:0}
.ld-step{border:1px solid var(--line);border-radius:10px;background:var(--raised);font-size:.86em;min-width:0}
.ld-step-h{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;color:var(--ink-2);min-width:0;text-align:left}
button.ld-step-h:hover{color:var(--ink)}
.ld-step-h .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:.95em}
.ld-step-h .chev-rot{transition:transform .15s;flex:none}
.ld-step-h[aria-expanded="true"] .chev-rot{transform:rotate(90deg)}
.ld-step.error .ld-step-h,.ld-step.denied .ld-step-h{color:var(--red-text)}
.ld-step.wait{border-color:var(--yellow);background:var(--yellow-tint)}
.ld-step.wait .ld-step-h{color:var(--ink)}
.ld-step.stopped{opacity:.6}
.ld-pm{display:inline-flex;gap:6px;font-family:var(--font-mono);font-size:.92em;flex:none}
.ld-pm .add{color:var(--green-text);font-weight:600}.ld-pm .del{color:var(--red-text);font-weight:600}
.ld-note{color:var(--ink-3);flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld-note.bad{color:var(--red-text)}
.ld-detail{border-top:1px solid var(--line);max-height:340px;overflow:auto}
.ld-detail-f{padding:6px 10px;border-top:1px solid var(--line)}
.ld-diff,.ld-out{margin:0;padding:6px 0;font:12px/1.55 var(--font-mono);background:var(--code-bg);color:var(--code-ink);overflow-x:auto;white-space:pre}

/* v15: one line per action, groups for reading, a task bar, review of changes */
.ld-bot{gap:6px}

function inline(t){

 let s=esc(t).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(all,label,url)=>keep(a(url,label)));
 s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)"]*[^\s<)".,;:!?])/g,(all,pre,url)=>pre+keep(a(url,url.replace(/^https?:\/\/(www\.)?/,'').slice(0,48))));
 s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)]|$)/g,'$1<em>$2</em>');

function md(src,ctx){

  if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){flush();out+='<hr>';i++;continue;}

  if((m=l.match(/^>\s?(.*)/))){fp();fl();(quote=quote||[]).push(m[1]);i++;continue;}
  if((m=l.match(/^\s*[-•*]\s+(.*)/))){fp();fq();if(!list||list.t!=='ul'){fl();list={t:'ul',items:[]};}list.items.push(m[1]);i++;continue;}

 for(const sess of [false,true]){try{const s=JSON.parse(store.get(SESSION_KEY,sess));if(s&&s.exp>Date.now())return s;}catch(e){}}
 store.del(SESSION_KEY);return null;
}
let lockTimer=null;
function renderAuth(err,email){
 const g=readGuard(),locked=g.until>Date.now();
 auth.innerHTML=`<div class="auth-card">
  ${mark('auth-mark')}
  <h1>Inicia sesión en Liminal</h1>
  <p class="auth-sub">Tu IA en español, sin tarjeta internacional.</p>
  <div class="oauth"><button type="button" class="btn block" data-action="oauth" data-val="google">${ic('globe','sm')}Continuar con Google</button><button type="button" class="btn block" data-action="oauth" data-val="apple">${ic('user','sm')}Continuar con Apple</button></div>
  <div class="or"><span>o con tu correo</span></div>
  <form data-form="login" novalidate>
   <div class="field"><label for="lg-email">Correo</label><input class="input" id="lg-email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="tu@correo.com" value="${esc(email||'')}" ${err&&err.field==='email'?'aria-invalid="true" aria-describedby="lg-err"':''}></div>
   <div class="field"><label for="lg-pass">Contraseña</label><div class="pw"><input class="input" id="lg-pass" name="password" type="password" autocomplete="current-password" ${err&&err.field==='password'?'aria-invalid="true" aria-describedby="lg-err"':''}><button type="button" data-action="toggle-pw" aria-label="Mostrar contraseña" aria-pressed="false">${ic('eye','sm')}</button></div></div>
   <div class="auth-row"><label class="check"><input type="checkbox" name="remember" id="lg-remember" checked>Recordarme 30 días</label><button type="button" class="link-btn" data-action="forgot">¿Olvidaste tu contraseña?</button></div>
   ${err?`<p class="auth-err" id="lg-err" role="alert"><i class="dotc r"></i><span>${esc(err.msg)}</span></p>`:''}
   <button type="submit" class="btn primary block" id="lg-btn" ${locked?'disabled':''}>${locked?`Espera ${Math.ceil((g.until-Date.now())/1000)} s`:'Iniciar sesión'}</button>
  </form>
  <p class="auth-foot">¿No tienes cuenta? <button type="button" class="link-btn" data-action="signup">Crear cuenta</button></p>
 </div>
 <p class="auth-note">Prototipo: el acceso se comprueba en este navegador. En producción se valida en el servidor.</p>`;
 clearInterval(lockTimer);
 if(locked){lockTimer=setInterval(()=>{const b=$('#lg-btn');const left=readGuard().until-Date.now();if(!b){clearInterval(lockTimer);return;}if(left<=0){clearInterval(lockTimer);b.disabled=false;b.textContent='Iniciar sesión';}else b.textContent=`Espera ${Math.ceil(left/1000)} s`;},500);}
}
function showAuth(err,email){
 app.hidden=true;auth.hidden=false;closeModal();closePop();renderAuth(err,email);
 const f=err&&err.field==='password'?$('#lg-pass'):$('#lg-email');if(f)f.focus();
}
async function doLogin(form){
 const email=form.elements.email.value.trim().toLowerCase(),pass=form.elements.password.value,remember=form.elements.remember.checked;
 const g=readGuard();
 if(g.until>Date.now()){renderAuth({msg:'Demasiados intentos. Espera unos segundos y vuelve a probar.'},email);return;}
 if(!email)return showAuth({field:'email',msg:'Escribe tu correo.'},email);
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showAuth({field:'email',msg:'Ese correo no parece válido. Revisa que tenga @ y un dominio.'},email);
 if(!pass)return showAuth({field:'password',msg:'Escribe tu contraseña.'},email);
 if(!(window.crypto&&crypto.subtle))return showAuth({msg:'Este navegador no puede verificar la contraseña. Abre la página con https.'},email);
 const btn=$('#lg-btn');if(btn){btn.disabled=true;btn.textContent='Verificando…';}
 const h=await sha256(pass);
 if(email===ADMIN.email&&h===ADMIN.hash){
  writeGuard({fails:0,until:0});
  SESSION={email:ADMIN.email,name:ADMIN.name,role:ADMIN.role,at:Date.now(),exp:Date.now()+(remember?30*D:12*H)};
  store.del(SESSION_KEY);store.set(SESSION_KEY,JSON.stringify(SESSION),!remember);
  startApp();toast(`Hola, ${ADMIN.name}. Entraste como administrador.`);return;
 }
 g.fails=(g.fails||0)+1;
 if(g.fails>=MAX_TRIES){g.fails=0;g.until=Date.now()+LOCK_MS;writeGuard(g);return showAuth({msg:'Demasiados intentos fallidos. Espera 30 segundos y vuelve a probar.'},email);}
 writeGuard(g);
 const left=MAX_TRIES-g.fails;
 showAuth({field:'password',msg:`Correo o contraseña incorrectos. Te ${left===1?'queda 1 intento':`quedan ${left} intentos`} antes de una pausa de 30 segundos.`},email);
}
function logout(silent){
 endVoice(false);islaClear();
 if(U.streaming)stopStream();
 // Signing out here also closes this device in the account's device list.
 if(!silent&&SESSION&&apiReady()&&U.server&&U.server.background){try{const d=JSON.parse(store.get(DEV_KEY)||'null');if(d&&d.token)fetch(apiBase()+'/devices/revoke',{method:'POST',headers:apiHeaders(true),body:JSON.stringify({email:SESSION.email,deviceId:d.id,token:d.token,target:d.id})}).catch(()=>{});}catch(e){}}
 store.del(DEV_KEY);U.devices=null;U.panel=null;paintPanel();
 store.del(SESSION_KEY);SESSION=null;U.view='home';U.chatId=null;U.projectId=null;
 showAuth(null,'');if(!silent)toast('Cerraste sesión');
}
function startApp(){
 loadState();
 auth.hidden=true;auth.innerHTML='';app.hidden=false;clearInterval(lockTimer);
 applyPrefs();render();
 setTimeout(()=>{resumeJobs();pingDevice();},300);
 // an invitation link: …?unirse=CODE
 const join=new URLSearchParams(location.search).get('unirse');
 if(join){try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){}setTimeout(()=>joinModal(join),450);}
 if(window.__lmApi){S.admin.api=window.__lmApi;window.__lmApi=null;save();}
 if(new URLSearchParams(location.search).get('dev')==='1')setTimeout(()=>openDev(),200);
}

function mediaHTML(m){
 const s=m.seed||1,vid=m.kind==='video',hgt=vid?56.25:100;
 const h1=s%360,h2=(h1+40+(s>>>9)%120)%360,h3=(h1+180)%360;
 const x=20+(s>>>3)%60,y=(15+(s>>>7)%40)*hgt/100,r=14+(s>>>11)%20;
 const g=hgt*0.72;
 const art=`<svg viewBox="0 0 100 ${hgt}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g${s}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h1} 70% 62%)"/><stop offset="1" stop-color="hsl(${h2} 65% 36%)"/></linearGradient></defs><rect width="100" height="${hgt}" fill="url(#g${s})"/><circle cx="${x}" cy="${y}" r="${r}" fill="hsl(${h3} 80% 78% / .55)"/><path d="M0 ${g} Q 30 ${g-14} 55 ${g-3} T 100 ${g-9} V ${hgt} H 0 Z" fill="hsl(${h2} 40% 18% / .55)"/></svg>`;
 return `<figure class="gen ${m.kind}" role="img" aria-label="${esc((vid?'Video creado a partir de: ':'Imagen creada a partir de: ')+m.prompt)}"><div class="gen-art">${art}</div>${vid?`<span class="gen-play">${ic('play')}</span><span class="gen-tag">0:05 · 720p</span>`:'<span class="gen-tag">1024 × 1024</span>'}<figcaption>Vista previa de demostración</figcaption></figure>`;
}

function scrollThread(force){const t=$('#thread');if(!t)return;const near=t.scrollHeight-t.scrollTop-t.clientHeight<140;if(force||near)t.scrollTop=t.scrollHeight;}
function wireComposer(){
 const ta=$('#prompt');if(!ta)return;
 const size=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,220)+'px';};
 size();
 ta.addEventListener('input',()=>{U.draft=ta.value;size();syncSend();paintSlash();});
 ta.addEventListener('keydown',e=>{
  if(U.slash&&U.slash.length){
   if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();U.slashSel=(U.slashSel+(e.key==='ArrowDown'?1:-1)+U.slash.length)%U.slash.length;paintSlash(true);return;}
   if((e.key==='Enter'&&!e.shiftKey&&!e.isComposing)||e.key==='Tab'){e.preventDefault();applySlash(U.slash[U.slashSel][0]);return;}
   if(e.key==='Escape'){e.preventDefault();e.stopPropagation();U.slash=null;paintSlash(true);return;}
  }
  if(e.key==='Backspace'&&!ta.value&&U.cmd){U.cmd=null;refreshComposer();return;}
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&S.prefs.enterSend){e.preventDefault();send();}
 });
 ta.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==ta&&U.slash){U.slash=null;paintSlash(true);}},180));
}

const PREVIEW=(()=>{try{return !!(window.claude&&typeof window.claude.use==='function')||/(^|\.)claude(usercontent)?\.(ai|com)$/.test(location.hostname);}catch(e){return false;}})();

   With the new server: answers keep going when the app closes (and come back when it opens),

const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return String(u||'');}};
const apiBase=()=>S.admin.api.url.replace(/\/+$/,'');

/* Reads server-sent events from a request and hands each one over. */
async function streamEvents(url,init,onEvent,signal,onChunk){
 const res=await fetch(url,Object.assign({},init,{signal}));
 if(!res.ok){let msg=`El servidor respondió con un error (${res.status}).`;try{const j=await res.json();if(j&&j.message)msg=j.message;}catch(e){}const err=new Error(msg);err.status=res.status;throw err;}
 if(!res.body)throw new Error('Este navegador no puede recibir la respuesta por partes.');
 const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
 for(;;){
  const {done,value}=await reader.read();if(onChunk)onChunk();if(done)break;
  buf+=dec.decode(value,{stream:true});let i;
  while((i=buf.indexOf('\n\n'))>=0){
   const block=buf.slice(0,i);buf=buf.slice(i+2);
   for(const line of block.split('\n')){if(!line.startsWith('data:'))continue;let ev;try{ev=JSON.parse(line.slice(5));}catch(e){continue;}onEvent(ev);}
  }
 }
}

}

 if(!opts.resume){bot.thought=opts.tier==='adv'?[]:null;bot.web=false;bot.sources=null;bot.thinking=0;bot.tools=[];}

 // photos go straight (too big to keep as a background job); research and the project go along

 if(opts.research||bot.research)body.research=true;

function runAnswer(c,idx,bot,opts,url,init){
 const ctrl=new AbortController();U.abort=ctrl;

 saveNow();
 const paint=()=>{if(Date.now()-saved>3000){saved=Date.now();save();}if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;updateMsg(c,idx);});};
 const begin=()=>{if(started)return;started=true;bot.pending=false;bot.reading=false;bot.streaming=true;bot.thinking=opts.tier==='adv'&&think?Math.max(1,Math.round((Date.now()-t0)/1000)):(bot.thinking||0);if(opts.tracked)islaSet('Escribiendo la respuesta');};

    if(ev.text){begin();bot.text=(bot.jobBase||'')+ev.text;}
    if(ev.think&&bot.thought){think=ev.think;bot.thought=thoughtLines(think);}
    (ev.tools||[]).forEach(t=>upsertTool(bot,t));
    if(ev.sources&&ev.sources.length)addSources(bot,ev.sources);
    if(ev.ask)bot.ask={items:ev.ask.items,state:ev.ask.state};
    if(ev.notice)bot.notice=ev.notice.message;
    break;
   case 'think':think+=ev.d;if(bot.thought)bot.thought=thoughtLines(think);break;
   case 'text':begin();bot.text+=ev.d;break;
   case 'tool':upsertTool(bot,ev);if(ev.status==='start'&&opts.tracked)islaSet(ev.name==='buscar_en_internet'?'Buscando en internet':'Leyendo '+(ev.host||'una página'));break;
   case 'sources':addSources(bot,ev.items);break;
   case 'ask':bot.ask={items:ev.items,state:ev.state};break;
   case 'notice':bot.notice=ev.message;bot.noticeKind=ev.kind||'cut';break;
   case 'vision':{const um=c.messages[idx-1],imgs=um&&um.files?um.files.filter(f=>f.kind==='image'):[];(ev.items||[]).forEach((it,k)=>{if(imgs[k])imgs[k].text=String(it.text||'').slice(0,8000);});saveNow();break;}

  else if(!bot.text&&!bot.ask)bot.text='El servidor terminó sin escribir nada. Toca «Volver a generar» para intentarlo otra vez.';
  finishStream(c,idx);
  if(opts.tracked){if(bot.ask)islaDone(`${MODEL_NAME} necesita tu permiso`,askLabel(bot.ask));else islaDone('Respuesta lista',plainPreview(bot.text));}

  if(ctrl.signal.aborted)return;U.abort=null;

  // try again by itself, waiting a bit longer each time (1 s, 2 s, 4 s…), and show «Reconectando…».
  // With the server's background answers it picks up the same answer; without them it asks again.
  const tries=opts.tries||0;

   bot.reconnecting=true;updateMsg(c,idx);

    if(bot.stopped||!U.streaming)return;

    if(bot.jobId&&info&&info.background)runAnswer(c,idx,bot,Object.assign({},opts,{tries:tries+1,resumed:true}),apiBase()+'/jobs/'+bot.jobId+'/stream',{headers:apiHeaders(false)});

  }

/* ---------- Live pages, apps and presentations (like artifacts) ----------
   A complete HTML file in an answer becomes a card; it opens in a side panel (full screen on phones)
   with a live preview, the code, download and full screen. */
const AF_NAME={page:'Página web',slides:'Presentación',svg:'Imagen SVG'};
function artifactKind(lang,src){
 const l=(lang||'').toLowerCase();
 if((l==='svg'||l==='xml')&&/<svg[\s>]/i.test(src))return 'svg';
 if((l==='html'||l==='htm'||l==='')&&/<!doctype html|<html[\s>]/i.test(src)){
  const title=(src.match(/<title[^>]*>([^<]*)/i)||[])[1]||'';
  return /class=["'][^"']*\b(slide|slides|diapositiva)\b/i.test(src)||/presentaci[oó]n|\bslides?\b|diapositivas/i.test(title)?'slides':'page';
 }
 return null;
}
function artifactTitle(src,kind){
 const t=(src.match(/<title[^>]*>([^<]{1,120})<\/title>/i)||[])[1];
 if(t&&t.trim())return t.trim().replace(/&amp;/g,'&');
 const h=(src.match(/<h1[^>]*>([\s\S]{1,200}?)<\/h1>/i)||[])[1];
 if(h){const x=h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();if(x)return x.slice(0,80);}
 return AF_NAME[kind];
}
function artifactsOf(text){
 const out=[],L=String(text||'').replace(/\r/g,'').split('\n');
 for(let i=0;i<L.length;i++){
  if(!L[i].startsWith('```'))continue;
  const lang=L[i].slice(3).trim(),code=[];let j=i+1;
  while(j<L.length&&!L[j].startsWith('```')){code.push(L[j]);j++;}
  const src=code.join('\n'),kind=artifactKind(lang,src);
  if(kind)out.push({kind,lang,code:src,closed:j<L.length,title:artifactTitle(src,kind),lines:code.length});
  i=j;
 }
 return out;
}

/* ---------- Island-style pill ----------
   Shows the live conversation when minimized, and images, videos or long answers while you are in another screen.
   The iPhone app shows the same in the real Dynamic Island and on the Lock Screen. */
const ISLA={kind:null,chatId:null,title:'',detail:'',t0:0,t1:0,phase:'',hideT:null,html:''};
function islaStart(kind,chatId,title,detail,ms){clearTimeout(ISLA.hideT);Object.assign(ISLA,{kind,chatId,title,detail:clip(detail),t0:Date.now(),t1:Date.now()+Math.max(500,ms),phase:'working'});paintIsla();}
function islaSet(title){if(ISLA.kind&&ISLA.phase==='working'){ISLA.title=title;paintIsla();}}
function islaDone(title,detail){if(!ISLA.kind)return;Object.assign(ISLA,{title,detail:clip(detail),phase:'done'});paintIsla();clearTimeout(ISLA.hideT);ISLA.hideT=setTimeout(()=>{ISLA.kind=null;paintIsla();},8000);}
function islaClear(){clearTimeout(ISLA.hideT);ISLA.kind=null;paintIsla();}
function paintIsla(){
 const el=$('#isla');if(!el)return;
 const voice=V.on&&V.min;
 const task=!V.on&&ISLA.kind&&S&&S.prefs&&S.prefs.island!==false&&!(U.view==='chat'&&U.chatId===ISLA.chatId);
 if(!voice&&!task){if(!el.hidden){el.hidden=true;el.innerHTML='';ISLA.html='';}clearInterval(U.islaTick);U.islaTick=null;return;}
 if(!U.islaTick)U.islaTick=setInterval(paintIsla,250);
 let html,label;
 if(voice){
  const st=V_ST[V.phase]||V_ST.starting;
  html=`${mark()}<span class="i-t"><b>${esc(V.phase==='listening'&&V.heard?'Te escucho…':st[0])}</b></span><span class="i-r"><span class="i-bars ${V.phase}">${'<i></i>'.repeat(4)}</span><span class="i-time">${fmtClock(Date.now()-V.t0)}</span></span>`;
  label=`Conversación en vivo: ${st[0]}. Toca para abrirla.`;
 }else{
  let right;
  if(ISLA.phase==='done')right=`<span class="i-ok">${ic('check','sm')}</span>`;
  else{const f=Math.max(0,Math.min(1,(Date.now()-ISLA.t0)/(ISLA.t1-ISLA.t0))),len=2*Math.PI*7;right=`<svg class="i-ring" viewBox="0 0 18 18" aria-hidden="true"><circle class="bg" cx="9" cy="9" r="7"/><circle class="fg" cx="9" cy="9" r="7" stroke-dasharray="${len.toFixed(2)}" stroke-dashoffset="${(len*(1-f)).toFixed(2)}"/></svg>`;}
  html=`${mark()}<span class="i-t"><b>${esc(ISLA.title)}</b>${ISLA.detail?`<small>${esc(ISLA.detail)}</small>`:''}</span><span class="i-r">${right}</span>`;
  label=`${ISLA.title}. Toca para abrir el chat.`;
 }
 if(html!==ISLA.html){el.innerHTML=html;ISLA.html=html;}
 el.setAttribute('aria-label',label);
 if(el.hidden)el.hidden=false;
}
function islaOpen(){
 if(V.on&&V.min){V.min=false;renderVoice();return;}
 const id=ISLA.chatId;if(ISLA.phase==='done')islaClear();
 if(id&&chatById(id))go('chat',id);
}

let toastT;

function copyText(text,ok='Copiado'){
 const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='absolute';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();let done=false;try{done=document.execCommand('copy');}catch(e){}ta.remove();toast(done?ok:'Selecciona el texto y cópialo manualmente');};
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast(ok),fallback);}else fallback();}catch(e){fallback();}
}

function afterPref(k){
 if(k==='prefs.tier'||k==='prefs.effort'||k==='prefs.advModel')renderTopbar();
 if(k==='prefs.defMode'&&U.view==='home'&&!(U.draft||'').trim())U.mode=S.prefs.defMode;
 if(k==='prefs.tempDefault'&&U.view!=='chat'){U.temp=S.prefs.tempDefault;renderTopbar();}
 if(k==='prefs.showThinking'&&U.view==='chat')renderChat();
 if(k==='prefs.plan')renderSidebar();
 if(k==='prefs.island')paintIsla();
 if(k==='prefs.notify'&&S.prefs.notify){
  if(!('Notification' in window)){S.prefs.notify=false;toast('Este navegador no permite avisos.');}
  else if(Notification.permission==='denied'){S.prefs.notify=false;toast('Los avisos están bloqueados para Liminal en tu navegador.');}
  else if(Notification.permission!=='granted')Notification.requestPermission().then(r=>{if(r!=='granted'){S.prefs.notify=false;save();renderSettings(true);toast('No diste permiso para los avisos.');}});
 }
 applyPrefs();save();renderSettings(true);
 const b=$(`[data-key="${k}"][aria-checked="true"]`);if(b&&!b.classList.contains('switch'))b.focus({preventScroll:true});
}

/** A clean project path, or null if it tries to leave the project. */
function ldPath(p){

}

/* ---------- Text tools ---------- */
function ldNumbered(text,from,to){
 const L=String(text).split('\n');const a=Math.max(1,Math.min(L.length,parseInt(from)||1)),b=Math.max(a,Math.min(L.length,parseInt(to)||L.length));
 const w=String(b).length,out=[];for(let i=a;i<=b;i++)out.push(String(i).padStart(w,' ')+'| '+L[i-1]);
 return{text:out.join('\n'),total:L.length,a,b};
}
/** The same lines, if the engine's copy only differs in line endings, trailing spaces or indentation. */
function ldFuzzy(text,find){
 const T=String(text).split('\n'),Q=String(find).replace(/\r\n/g,'\n').split('\n');
 while(Q.length&&!Q[Q.length-1].trim())Q.pop();while(Q.length&&!Q[0].trim())Q.shift();
 if(!Q.length)return null;
 for(const norm of [s=>s.replace(/\s+$/,''),s=>s.trim()]){
  const q=Q.map(norm);let hit=-1,many=false;
  for(let i=0;i+q.length<=T.length;i++){let ok=true;for(let k=0;k<q.length;k++)if(norm(T[i+k])!==q[k]){ok=false;break;}if(ok){if(hit>=0){many=true;break;}hit=i;}}
  if(hit>=0&&!many)return T.slice(hit,hit+q.length).join('\n');
 }
 return null;
}
/** A line diff for showing changes: common start and end trimmed, LCS in the middle. */
function ldDiff(a,b){
 const A=a==null?[]:String(a).split('\n'),B=b==null?[]:String(b).split('\n');
 let s=0;while(s<A.length&&s<B.length&&A[s]===B[s])s++;
 let e=0;while(e<A.length-s&&e<B.length-s&&A[A.length-1-e]===B[B.length-1-e])e++;
 const x=A.slice(s,A.length-e),y=B.slice(s,B.length-e);let ops=[];
 if(x.length&&y.length&&x.length*y.length<=160000){
  const n=x.length,m=y.length,dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=x[i]===y[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0;while(i<n&&j<m){if(x[i]===y[j]){ops.push([' ',x[i]]);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])ops.push(['-',x[i++]]);else ops.push(['+',y[j++]]);}
  while(i<n)ops.push(['-',x[i++]]);while(j<m)ops.push(['+',y[j++]]);
 }else ops=x.map(l=>['-',l]).concat(y.map(l=>['+',l]));
 const add=ops.filter(o=>o[0]==='+').length,del=ops.filter(o=>o[0]==='-').length;
 const pre=A.slice(Math.max(0,s-2),s).map(l=>[' ',l]),post=A.slice(A.length-e,A.length-e+2).map(l=>[' ',l]);
 const all=pre.concat(ops,post);
 return{start:Math.max(0,s-2)+1,ops:all.length>240?all.slice(0,240).concat([['…',`${all.length-240} líneas más`]]):all,add,del};
}

 if(path&&!(path in p.files)){LD.open=LD.open.filter(f=>f!==path);if(LD.file===path)LD.file=LD.open[0]||null;}
 else if(path&&!LD.file){LD.file=path;LD.open=[path];if(ldNarrow())LD.mtree=false;}

/* ---------- The project tools (what Lithium Dev can do on the device) ---------- */
async function ldTool(p,call,item,signal){
 const a=call.args||{},F=p.files;
 const need=k=>{const v=ldPath(a[k]);if(!v)throw new Error(`Error: la ruta «${String(a[k]||'')}» no es válida. Usa rutas relativas al proyecto, como src/app.js.`);return v;};
 const missing=r=>{const name=r.split('/').pop().toLowerCase(),base=name.replace(/\.[^.]+$/,'');const s=Object.keys(F).filter(f=>f.toLowerCase().endsWith(name)||(base&&f.toLowerCase().includes(base))).slice(0,5);return `Error: no existe el archivo «${r}».`+(s.length?` ¿Quisiste decir ${s.join(', ')}?`:` Archivos del proyecto: ${Object.keys(F).sort().slice(0,40).join(', ')||'(ninguno)'}.`);};
 try{
  switch(call.name){
   case 'listar_archivos':{
    const ks=Object.keys(F).sort();item.note=`${ks.length} archivo${ks.length===1?'':'s'}`;
    return ks.length?ks.map(k=>`${k} (${ldSize(F[k])} bytes)`).join('\n'):'El proyecto está vacío. Crea los archivos con escribir_archivo.';
   }
   case 'leer_archivo':{
    const r=need('ruta');item.path=r;if(!(r in F))return missing(r);
    if(ldIsData(F[r]))return `«${r}» es un archivo binario (${ldMime(r)}, ${ldSize(F[r])} bytes); no se puede leer como texto.`;
    const ranged=a.desde!=null||a.hasta!=null,from=parseInt(a.desde)||1;
    const n=ldNumbered(F[r],from,ranged&&a.hasta!=null?a.hasta:from+299);let t=n.text,last=n.b;
    if(t.length>LD_OUT){const cut=t.lastIndexOf('\n',LD_OUT);t=t.slice(0,cut>0?cut:LD_OUT);last=parseInt((t.split('\n').pop()||'').trim())||n.b;}
    item.note=n.a===1&&last===n.total?`${n.total} líneas`:`líneas ${n.a}–${last}`;
    const more=last<n.total?`\n… Faltan las líneas ${last+1}-${n.total}. Para ir directo a lo que necesitas usa buscar_en_proyecto y lee ese rango con desde/hasta.`:'';
    return `${r} · líneas ${n.a}-${last} de ${n.total}\n${t}${more}`;
   }
   case 'escribir_archivo':{
    const r=need('ruta');item.path=r;const content=String(a.contenido==null?'':a.contenido);const before=r in F?F[r]:null;
    if(before!=null&&ldIsData(before))return `Error: «${r}» es un archivo binario; no se puede escribir como texto.`;
    const next=a.anexar&&before!=null?before+content:content;
    F[r]=next;item.diff=ldDiff(before,next);item.created=before==null;ldTouch(p,r);
    return `Listo: ${before==null?'creaste':a.anexar?'añadiste contenido a':'reemplazaste'} ${r} (${ldLinesOf(next)} líneas).`+await ldDiagNote(item,r,next);
   }
   case 'editar_archivo':{
    const r=need('ruta');item.path=r;if(!(r in F))return missing(r);
    if(ldIsData(F[r]))return `Error: «${r}» es un archivo binario.`;
    const list=Array.isArray(a.cambios)&&a.cambios.length?a.cambios.slice(0,40):[{buscar:a.buscar,reemplazar:a.reemplazar,todas:a.todas}];
    const text=F[r];let next=text,count=0;
    for(let k=0;k<list.length;k++){
     const c=list[k]||{},find=String(c.buscar==null?'':c.buscar),rp=String(c.reemplazar==null?'':c.reemplazar),all=c.todas===true;
     const tag=list.length>1?` (cambio ${k+1} de ${list.length}; no se aplicó ninguno)`:'';
     if(!find)return `Error: «buscar» está vacío${tag}. Para crear o reemplazar el archivo completo usa escribir_archivo.`;
     let use=find,n=next.split(find).length-1;
     if(!n){const alt=ldFuzzy(next,find);if(!alt)return `Error: no encontré ese texto en ${r}${tag}. Vuelve a leer esa parte con leer_archivo (desde/hasta) y copia el fragmento exacto, con sus espacios.`;use=alt;n=1;}
     if(n>1&&!all)return `Error: ese texto aparece ${n} veces en ${r}${tag}. Incluye más líneas alrededor para que sea único, o usa todas=true.`;
     if(all){next=next.split(use).join(rp);count+=n;}else{const at=next.indexOf(use);next=next.slice(0,at)+rp+next.slice(at+use.length);count++;}
    }
    F[r]=next;item.diff=ldDiff(text,next);ldTouch(p,r);
    const [x,y]=ldNewRange(item.diff),shown=ldNumbered(next,Math.max(1,x-2),Math.min(y+2,x+60));
    return `Listo: ${r} editado (${count} cambio${count===1?'':'s'}). Así quedó esa parte:\n${shown.text}`+await ldDiagNote(item,r,next);
   }
   case 'mover_archivo':{
    const from=need('de'),to=need('a');item.path=to;item.from=from;
    if(!(from in F))return missing(from);if(to in F&&to!==from)return `Error: ya existe ${to}. Bórralo antes o elige otro nombre.`;
    F[to]=F[from];delete F[from];LD.open=LD.open.map(f=>f===from?to:f);if(LD.file===from)LD.file=to;ldTouch(p,from);ldTouch(p,to);
    return `Listo: ${from} → ${to}.`;
   }
   case 'borrar_archivo':{
    const r=need('ruta');item.path=r;if(!(r in F))return missing(r);
    item.diff=ldIsData(F[r])?null:ldDiff(F[r],null);delete F[r];ldTouch(p,r);
    return `Listo: borraste ${r}.`;
   }
   case 'buscar_en_proyecto':{
    const q=String(a.texto||'');if(!q)return 'Error: falta el texto a buscar.';
    let re;try{re=a.regex===true?new RegExp(q,'i'):null;}catch(e){return 'Error: la expresión regular no es válida: '+e.message;}
    const glob=a.archivos?ldGlob(String(a.archivos)):null,ctx=Math.max(0,Math.min(3,parseInt(a.contexto)||0));
    const lq=q.toLowerCase(),hits=[];let total=0,files=0;
    for(const f of Object.keys(F).sort()){
     if(ldIsData(F[f])||(glob&&!glob.test(f)))continue;
     const L=String(F[f]).split('\n');let here=0;
     L.forEach((l,i)=>{if(!(re?re.test(l):l.toLowerCase().includes(lq)))return;total++;here++;if(hits.length>=150)return;
      if(ctx){for(let j=Math.max(0,i-ctx);j<=Math.min(L.length-1,i+ctx);j++)hits.push(`${f}:${j+1}${j===i?':':'-'} ${L[j].slice(0,200)}`);hits.push('--');}
      else hits.push(`${f}:${i+1}: ${l.trim().slice(0,220)}`);});
     if(here)files++;
    }
    item.note=`${total} resultado${total===1?'':'s'}`;
    return total?`${total} resultado${total===1?'':'s'} en ${files} archivo${files===1?'':'s'}:\n`+hits.join('\n')+(hits.length>=150?`\n… hay más. Busca algo más específico o filtra con «archivos».`:''):`Sin resultados para «${q}»${glob?' en '+a.archivos:''}.`;
   }
   case 'ejecutar_js':{
    const r=a.ruta?need('ruta'):null;item.path=r;
    if(r&&!(r in F))return missing(r);
    const out=await ldRunJS(p,r,a.codigo,signal);item.output=out.log;item.errors=out.errors;item.note=out.errors?`${out.errors} error${out.errors>1?'es':''}`:'sin errores';
    return out.text;
   }
   case 'ejecutar_python':{
    const r=a.ruta?need('ruta'):null;item.path=r;
    if(r&&!(r in F))return missing(r);
    const out=await ldRunPython(p,r,a.codigo,signal);item.output=out.log;item.errors=out.errors;item.note=out.errors?`${out.errors} error${out.errors>1?'es':''}`:'sin errores';
    return out.text;
   }
   case 'vista_previa':{
    const r=a.ruta?need('ruta'):ldMainHtml(p);item.path=r;
    if(!r)return 'Error: el proyecto no tiene ninguna página HTML. Crea index.html primero.';
    if(!(r in F))return missing(r);
    const out=await ldCheckPage(p,r,signal);item.output=out.log;item.errors=out.errors;item.note=out.errors?`${out.errors} error${out.errors>1?'es':''}`:'sin errores';
    if(LD.cur===p){LD.previewPath=r;if(ldWorkVisible('preview'))ldReloadPreview();}
    return out.text;
   }
   case 'lista_de_tareas':{
    const list=(Array.isArray(a.tareas)?a.tareas:[]).slice(0,30).map(t=>({tarea:clip(t&&t.tarea||'',200),estado:['pendiente','en_curso','hecha'].includes(t&&t.estado)?t.estado:'pendiente'})).filter(t=>t.tarea);
    p.todo=list;item.todo=list;
    return 'Lista de tareas actualizada.';
   }
   default:return `Error: la herramienta ${call.name} no existe en Liminal Dev.`;
  }
 }catch(e){if(e&&e.name==='AbortError')throw e;return e&&/^Error/.test(e.message)?e.message:'Error: '+((e&&e.message)||e);}
}

/** Syntax check of JavaScript (also inside HTML) and JSON, as an editor would show it. Parsing never runs the code. */
function ldAcorn(){return window.acorn?Promise.resolve(window.acorn):loadLib('acorn').then(()=>window.acorn||null).catch(()=>null);}
async function ldDiagnose(path,text){
 try{
  const e=ldExt(path);

  const js=/^(m?js|cjs)$/.test(e),html=/^html?$/.test(e);if(!js&&!html)return '';
  const acorn=await ldAcorn();if(!acorn)return '';
  const check=(code,offset)=>{try{acorn.parse(code,{ecmaVersion:'latest',sourceType:/(^|\n)\s*(import|export)[\s{*]/.test(code)?'module':'script',allowHashBang:true,allowAwaitOutsideFunction:true,allowReturnOutsideFunction:true});return '';}catch(err){return err.loc?`línea ${err.loc.line+offset}, columna ${err.loc.column+1}: ${String(err.message).replace(/\s*\(\d+:\d+\)\s*$/,'')}`:'';}};
  if(js){const r=check(text,0);return r?`Error de sintaxis en ${path}, ${r}.`:'';}

function ldRunPython(p,path,code,signal){
 return new Promise(resolve=>{
  const src=path?p.files[path]:String(code||'');
  if(!String(src||'').trim()){resolve({text:'Error: falta «ruta» o «codigo».',log:'',errors:1});return;}
  const py=ldPython(),run='r'+uid(),lines=[];let errors=0,done=false;
  const first=!py.ready;
  const end=why=>{
   if(done)return;done=true;clearTimeout(t);delete py.runs[run];
   const log=lines.join('\n');
   resolve({text:(why?why+'\n':'')+(log?`Salida:\n${ldClip(log,LD_OUT)}`:'(no imprimió nada)')+'\n'+(errors?`${errors} error${errors>1?'es':''}.`:'Terminó sin errores.'),log,errors});
  };
  py.runs[run]={line:d=>{const text=String(d.text);lines.push(d.level==='error'?'[error] '+text:text);if(d.level==='error')errors++;ldLog(d.level==='error'?'error':'log',text,path||'Python');},end,fail:m=>{errors++;end(m);}};
  // a run that never ends: the frame (and Python with it) is closed and starts fresh next time
  const t=setTimeout(()=>{errors++;if(LD.py===py){LD.py=null;py.fr.drop();}end(first?'Python tardó demasiado en cargar o en ejecutar. Revisa tu conexión e inténtalo otra vez.':'Se detuvo a los 30 segundos: ¿un bucle que no termina o un input() esperando?');},first?120000:30000);
  if(signal)signal.addEventListener('abort',()=>{if(LD.py===py){LD.py=null;py.fr.drop();}end('Detenido.');},{once:true});
  if(first){ldLog('info','Cargando Python por primera vez (unos segundos)…','Python');}
  const files={};Object.keys(p.files).forEach(k=>{const v=p.files[k];if(!ldIsData(v))files[k]=v;else if(ldSize(v)<4e6)files[k]=ldBytes(v);});
  const send=()=>{try{py.fr.f.contentWindow.postMessage({ld:py.fr.id,type:'run',run,files,code:src,name:path||'<codigo>',repl:!path},'*');}catch(e){end('Error: no se pudo iniciar Python.');}};
  if(py.ready)send();else py.waiters.push(send);
 });
}

/** One request to the server, watched: it has to end with «done», and silence for too long counts as a dropped connection. */
async function ldStream(body,onEvent,signal){
 const inner=new AbortController(),stop=()=>inner.abort();signal.addEventListener('abort',stop,{once:true});
 let stall=null,stalled=false,done=false,error=null;
 const bump=()=>{clearTimeout(stall);stall=setTimeout(()=>{stalled=true;inner.abort();},LD_STALL);};
 try{
  bump();
  const res=await fetch(apiBase()+'/chat',{method:'POST',headers:apiHeaders(true),body:JSON.stringify(body),signal:inner.signal});
  if(!res.ok){let msg=`El servidor respondió con un error (${res.status}).`;try{const j=await res.json();if(j&&j.message)msg=j.message;}catch(e){}const err=new Error(msg);err.status=res.status;throw err;}
  if(!res.body)throw new Error('Este navegador no puede recibir la respuesta por partes.');
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
   const {done:end,value}=await reader.read();bump();if(end)break;
   buf+=dec.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n\n'))>=0){
    const block=buf.slice(0,i);buf=buf.slice(i+2);
    for(const line of block.split('\n')){if(!line.startsWith('data:'))continue;let ev;try{ev=JSON.parse(line.slice(5));}catch(e){continue;}if(ev.t==='done'){done=true;onEvent(ev);}else if(ev.t==='error')error=ev;else onEvent(ev);}
   }
  }
 }catch(e){if(signal.aborted)throw ldAbortError();if(!stalled)throw e;}
 finally{clearTimeout(stall);signal.removeEventListener('abort',stop);}
 if(error){const err=new Error(error.message||'Error del servidor.');err.status=error.status||0;err.server=true;throw err;}
 return done;
}

async function ldServerRound(p,bot,turn,signal){
 let tight=false;
 for(let attempt=0;;attempt++){
  const mark=bot.items.length,turnLen=turn.length;let calls=[],text=null,err=null,ok=false;
  const body=Object.assign(profileForModel('general',false),{tier:bot.tier,effort:bot.effort,dev:true,project:ldSummary(p),messages:ldHistory(p,bot),turn:ldCompact(turn,tight?60000:130000),browse:S.prefs.browse==='off'?'off':'auto'});
  ldSetCtx(Math.round(JSON.stringify(body).length/3.6));
  try{
   ok=await ldStream(body,ev=>{
    if(bot.status){bot.status=null;ldPaintSoon();}
    if(ev.t==='text'){if(!text){text={type:'text',text:''};bot.items.push(text);}text.text+=ev.d;ldPaintSoon();}
    else if(ev.t==='tool'){text=null;const k=bot.items.findIndex(it=>it.type==='web'&&it.id===ev.id);const v={type:'web',id:ev.id,name:ev.name,query:ev.query||'',url:ev.url||'',host:ev.host||'',status:ev.status==='start'?'run':ev.status==='done'?'done':'error',title:ev.title||''};if(k<0)bot.items.push(v);else Object.keys(v).forEach(key=>{if(v[key])bot.items[k][key]=v[key];});ldPaintSoon();}
    else if(ev.t==='turn'){turn.push(...(ev.add||[]));text=null;}
    else if(ev.t==='client_tools'){calls=ev.calls||[];}
    else if(ev.t==='notice'){bot.items.push({type:'note',text:ev.message});}
    else if(ev.t==='done'&&ev.usage){ldCount(bot,ev.usage);}
   },signal);
  }catch(e){if(e&&e.name==='AbortError')throw e;err=e;}
  if(ok&&!err)return calls;
  // Undo what this attempt added, then decide whether it is worth trying again.
  bot.items.splice(mark);turn.length=turnLen;
  const st=(err&&err.status)||0;
  if(err&&err.server&&st===400&&!tight){tight=true;continue;}
  const again=!err||!st||st===429||st>=500;
  if(!again||attempt>=3){bot.status=null;throw err||new Error('Se cortó la conexión con el servidor varias veces. Revisa tu internet y pulsa Continuar.');}

 }
}
async function ldAgent(p,bot,signal,turn){

  const before=bot.items.length;
  const calls=live?await ldServerRound(p,bot,turn,signal):await ldDemoRound(p,bot,round,signal);
  if(!calls.length){if(!bot.items.slice(before).some(it=>it.type==='text'&&it.text.trim()))bot.empty=true;return;}
  for(const call of calls){
   if(signal.aborted)throw ldAbortError();
   const item={type:'tool',id:call.id,name:call.name,args:ldArgsBrief(call.args),status:'run'};bot.items.push(item);ldPaintSoon();
   if(LD_CHANGES.has(call.name)&&bot.plan){item.status='denied';item.note='modo plan';turn.push({role:'tool',tool_call_id:call.id,content:'Error: estás en modo plan. No cambies archivos: termina el plan y pregunta si lo apruebo.'});continue;}

    item.status='wait';item.pend=ldProposal(p,call);ldPaint();ldNotify(`${MODEL_NAME} necesita tu permiso`,`Quiere ${ldLabel(item,true).toLowerCase()}`);
    const ok=await new Promise(res=>{LD.approve={item,res};});

    if(signal.aborted)throw ldAbortError();
    if(!ok){item.status='denied';turn.push({role:'tool',tool_call_id:call.id,content:'La persona no aprobó este cambio. No lo repitas igual: pregúntale qué prefiere o sigue con otra parte.'});ldPaint();continue;}
    item.status='run';ldPaint();
   }
   // a tool never holds the task forever
   const result=await Promise.race([ldTool(p,call,item,signal),ldSleep(180000,signal).then(()=>'Error: la herramienta tardó demasiado y se detuvo. Prueba de otra forma.')]);
   item.status=/^Error/.test(result)?'error':'done';
   if(item.status==='error')item.note=clip(result.replace(/^Error:\s*/,''),140);
   turn.push({role:'tool',tool_call_id:call.id,content:ldClip(result,LD_OUT)});
   ldSave(p);ldPaintSoon();

const LD_CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

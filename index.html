function ldZip(files){
 const enc=new TextEncoder(),parts=[],central=[],d=new Date();let off=0,n=0;
 const date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
 for(const path of Object.keys(files).sort()){
  const name=enc.encode(path),data=ldBytes(files[path]),crc=ldCrc(data);n++;
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,time,true);h.setUint16(12,date,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),name,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,time,true);c.setUint16(14,date,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  central.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length;
 }
 const size=central.reduce((s,b)=>s+b.length,0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,n,true);e.setUint16(10,n,true);e.setUint32(12,size,true);e.setUint32(16,off,true);

const ldSkip=path=>/(^|\/)(\.git|node_modules|__MACOSX|\.DS_Store|Thumbs\.db|dist|build|\.next|\.venv|venv|__pycache__)(\/|$)/i.test(path)||/\.(exe|dll|so|dylib|bin|iso|dmg|apk|ipa|class|jar|pyc|o|a|lock)$/i.test(path)&&!/package-lock\.json$/.test(path);

 const u=new Uint8Array(buf),dv=new DataView(buf);let e=-1;
 for(let i=u.length-22;i>=Math.max(0,u.length-65558);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
 if(e<0)throw new Error('Ese archivo no es un ZIP válido.');
 const count=dv.getUint16(e+10,true),dec=new TextDecoder(),out=[];let q=dv.getUint32(e+16,true);
 for(let k=0;k<count;k++){
  if(q+46>u.length||dv.getUint32(q,true)!==0x02014b50)break;
  const method=dv.getUint16(q+10,true),csize=dv.getUint32(q+20,true),usize=dv.getUint32(q+24,true),nl=dv.getUint16(q+28,true),xl=dv.getUint16(q+30,true),cl=dv.getUint16(q+32,true),loc=dv.getUint32(q+42,true);

  if(name.endsWith('/'))continue;

async function ldInflate(entry){
 if(entry.method===0)return entry.raw;
 if(entry.method!==8)throw new Error('Formato de compresión no soportado.');

/** Files from a ZIP or a folder pick: common top folder removed, junk and huge files skipped. */
async function ldFilesFrom(list){
 let names=list.map(x=>x.name.replace(/\\/g,'/')).filter(n=>!ldSkip(n));
 const top=names.length&&names.every(n=>n.includes('/')&&n.split('/')[0]===names[0].split('/')[0])?names[0].split('/')[0]+'/':'';
 const files={};let skipped=0,count=0;
 for(const x of list){
  const name=x.name.replace(/\\/g,'/');if(ldSkip(name))continue;
  const path=ldPath(top&&name.startsWith(top)?name.slice(top.length):name);if(!path)continue;
  if(count>=500||(x.usize||x.size||0)>2.5e6){skipped++;continue;}
  const bytes=await x.read();
  if(LD_BIN.test(path)){if(bytes.length>1.5e6){skipped++;continue;}files[path]=await ldDataUrl(new Blob([bytes]),path);}
  else{const text=new TextDecoder().decode(bytes);if(text.includes('\u0000')){skipped++;continue;}files[path]=text;}

  const r=await ldFilesFrom(entries.map(en=>({name:en.name,usize:en.usize,read:()=>ldInflate(en)})));
  if(!Object.keys(r.files).length){toast('Ese ZIP no tiene archivos de código que pueda abrir.');return;}
  const p=ldNew(r.top||file.name.replace(/\.zip$/i,''),null,r.files);ldOpen(p);if(U.view!=='dev')go('dev');else{renderDev();renderSidebar();renderTopbar();}

}
async function ldImportGitHub(input){

 const m=s.match(/github\.com\/([^/\s]+)\/([^/\s#?]+)(?:\/tree\/([^/\s]+)(?:\/([^\s#?]+))?)?/i)||s.match(/^([\w.-]+)\/([\w.-]+)$/);
 if(!m){toast('Pega el enlace del repositorio, por ejemplo github.com/usuario/proyecto');return;}
 if(blockedHere()){toast(PREVIEW_MSG);return;}
 const owner=m[1],repo=m[2].replace(/\.git$/i,''),sub=(m[4]||'').replace(/\/+$/,'');let branch=m[3]||'';
 const api=`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
 try{
  toast(`Buscando ${owner}/${repo} en GitHub…`);
  if(!branch){const r=await fetch(api);if(r.status===404)throw new Error('No encontré ese repositorio. Tiene que ser público.');if(!r.ok)throw new Error(r.status===403?'GitHub limitó las consultas por ahora. Intenta en una hora o importa el ZIP.':`GitHub respondió con un error (${r.status}).`);branch=(await r.json()).default_branch||'main';}
  const t=await fetch(`${api}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
  if(!t.ok)throw new Error(t.status===404?'No encontré esa rama.':`GitHub respondió con un error (${t.status}).`);
  const tree=((await t.json()).tree||[]).filter(x=>x.type==='blob'&&(!sub||x.path.startsWith(sub+'/'))&&!ldSkip(x.path));
  const list=tree.slice(0,300).map(x=>({name:sub?x.path.slice(sub.length+1):x.path,size:x.size,read:async()=>{const r=await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch.split('/').map(encodeURIComponent).join('/')}/${x.path.split('/').map(encodeURIComponent).join('/')}`);if(!r.ok)throw new Error('raw');return new Uint8Array(await r.arrayBuffer());}}));
  // download a few at a time
  const cache={};let k=0;
  await Promise.all(Array.from({length:8},async()=>{while(k<list.length){const x=list[k++];if(x.size>2.5e6)continue;try{cache[x.name]=await x.read();}catch(e){}}}));
  const r=await ldFilesFrom(list.filter(x=>cache[x.name]).map(x=>({name:x.name,size:x.size,read:async()=>cache[x.name]})));
  if(!Object.keys(r.files).length)throw new Error('Ese repositorio no tiene archivos que pueda abrir.');
  const p=ldNew(sub?sub.split('/').pop():repo,null,r.files);ldOpen(p);if(U.view!=='dev')go('dev');else{renderDev();renderSidebar();renderTopbar();}
  toast(`Importaste ${Object.keys(r.files).length} archivos de ${owner}/${repo}${tree.length>300?' (los primeros 300)':''}.`);
 }catch(e){toast(e&&e.message&&e.name!=='TypeError'?e.message:'No pude conectarme con GitHub. Revisa tu conexión.');}
}

  const before=ta.value.slice(0,ta.selectionStart),cmd=ta.value.match(/^\/(\S*)$/),at=before.match(/(^|\s)@([\w./-]*)$/);
  if(cmd){const q=fold(cmd[1]);LD.popItems=LD_CMDS.filter(c=>c[0].startsWith(q)||fold(c[1]).includes(q)).map(c=>({action:'ld-cmd',val:c[0],icon:c[3],title:'/'+c[0],sub:c[2]}));}
  else if(at&&LD.cur){const q=at[2].toLowerCase();LD.popItems=Object.keys(LD.cur.files).filter(f=>f.toLowerCase().includes(q)).sort((a,b)=>a.length-b.length).slice(0,8).map(f=>({action:'ld-at',val:f,icon:'file',title:f,sub:`${ldLinesOf(LD.cur.files[f])} líneas`}));}

 };
 ta.addEventListener('input',()=>{LD.draft=ta.value;size();const b=$('#ld-send');if(b)b.disabled=!ta.value.trim();suggest();});
 ta.addEventListener('keydown',e=>{

   if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();LD.popSel=(LD.popSel+(e.key==='ArrowDown'?1:-1)+LD.popItems.length)%LD.popItems.length;ldPaintPop();return;}
   if((e.key==='Enter'&&!e.shiftKey&&!e.isComposing)||e.key==='Tab'){e.preventDefault();ldPick(LD.popItems[LD.popSel]);return;}

  }

/** A photo at most `max` pixels on its longest side, as JPEG: enough to read a receipt, light on 3G. */
function shrinkImage(file,max,q){return new Promise(res=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*r));c.height=Math.max(1,Math.round(img.naturalHeight*r));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));};img.onerror=()=>{URL.revokeObjectURL(url);res(null);};img.src=url;});}

const wgParse=code=>{try{const j=JSON.parse(code);return j&&typeof j==='object'?j:null;}catch(e){return null;}};

const wgShort=n=>{const a=Math.abs(n);return a>=1e9?(n/1e9).toLocaleString('es',{maximumFractionDigits:1})+' mil M':a>=1e6?(n/1e6).toLocaleString('es',{maximumFractionDigits:1})+' M':a>=1e4?(n/1e3).toLocaleString('es',{maximumFractionDigits:1})+' K':n.toLocaleString('es',{maximumFractionDigits:2});};

const wgRaw=(name,code)=>`<div class="code"><div class="code-head"><span>${name}</span><button type="button" data-action="copy-code">Copiar</button></div><pre><code>${esc(code)}</code></pre></div>`;

}
function chartHTML(code,closed){

 const kind=/^(torta|pie|dona|donut|pastel)$/i.test(j.tipo)?'pie':/^(l[ií]neas?|line)$/i.test(j.tipo)?'line':'bar';
 let labels=j.etiquetas.slice(0,24).map(x=>String(x).slice(0,28));
 let series=j.series.slice(0,kind==='pie'?1:4).map(s=>({name:String((s&&(s.nombre||s.name))||'').slice(0,40),vals:labels.map((_,i)=>Number(((s&&(s.valores||s.values))||[])[i]))}));
 const unit=String(j.unidad||'').slice(0,8),title=String(j.titulo||'').slice(0,140);

 if(kind==='pie'){

  let parts=labels.map((l,i)=>({l,v:Math.max(0,series[0].vals[i]||0)})).filter(x=>x.v>0);

  const tot=parts.reduce((s,x)=>s+x.v,0);if(!tot)return wgRaw('gráfico',code);
  const cx=110,cy=110,R=100,r=62;let a0=-Math.PI/2;
  const arcs=parts.map((x,i)=>{const a1=a0+x.v/tot*Math.PI*2,big=a1-a0>Math.PI?1:0,p=(rad,ang)=>`${(cx+rad*Math.cos(ang)).toFixed(2)},${(cy+rad*Math.sin(ang)).toFixed(2)}`;
   const d=parts.length===1?`M${cx-R},${cy}A${R},${R} 0 1 1 ${cx+R},${cy}A${R},${R} 0 1 1 ${cx-R},${cy}ZM${cx-r},${cy}A${r},${r} 0 1 0 ${cx+r},${cy}A${r},${r} 0 1 0 ${cx-r},${cy}Z`:`M${p(R,a0)}A${R},${R} 0 ${big} 1 ${p(R,a1)}L${p(r,a1)}A${r},${r} 0 ${big} 0 ${p(r,a0)}Z`;
   a0=a1;return `<path d="${d}" fill="${x.other?'var(--ink-3)':`var(--s${i+1})`}" stroke="var(--raised)" stroke-width="2" fill-rule="evenodd"><title>${esc(x.l)}: ${esc(wgNum(x.v,unit))} (${Math.round(x.v/tot*100)}%)</title></path>`;});
  const pct=parts.map(x=>Math.round(x.v/tot*100)+'%');
  return `<figure class="wg wg-chart">${head}<div class="wg-pie"><svg viewBox="0 0 220 220" role="img" aria-label="${esc(title||'Gráfico de partes')}">${arcs.join('')}<text x="${cx}" y="${cy-4}" text-anchor="middle" class="wg-tot">${esc(wgShort(tot))}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" class="wg-ax">${esc(unit||'total')}</text></svg><div class="wg-legend col">${parts.map((x,i)=>`<span><i style="background:${x.other?'var(--ink-3)':`var(--s${i+1})`}"></i>${esc(x.l)}<b>${pct[i]}</b></span>`).join('')}</div></div>${wgTable(parts.map(x=>x.l),[{name:series[0].name||'Valor',vals:parts.map(x=>x.v)}],unit,pct)}</figure>`;
 }
 const W=innerWidth<560?380:640,H=innerWidth<560?220:250,L=46,Rr=10,T=12,B=34,n=labels.length,k=series.length; // narrow screens draw at their own size, so the text stays readable
 const all=series.flatMap(s=>s.vals).filter(v=>isFinite(v));if(!all.length)return wgRaw('gráfico',code);

 const y=v=>T+(hi-v)/(hi-lo)*(H-T-B),plotW=W-L-Rr,band=plotW/n;
 let g='';
 for(let t=0;t<=4;t++){const v=lo+(hi-lo)*t/4,yy=y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}" class="wg-grid${v===0?' zero':''}"/><text x="${L-8}" y="${(+yy+4).toFixed(1)}" text-anchor="end" class="wg-ax">${esc(wgShort(v))}</text>`;}
 const every=Math.ceil(n/(innerWidth<560?5:9));
 labels.forEach((l,i)=>{if(i%every)return;const x=kind==='bar'?L+band*i+band/2:L+(n===1?plotW/2:plotW*i/(n-1));g+=`<text x="${x.toFixed(1)}" y="${H-B+18}" text-anchor="middle" class="wg-ax">${esc(l.length>11?l.slice(0,10)+'…':l)}</text>`;});

 if(kind==='bar'){
  const group=band*.74,bw=Math.max(2,(group-(k-1)*2)/k);
  series.forEach((s,si)=>s.vals.forEach((v,i)=>{if(!isFinite(v))return;const x=L+band*i+(band-group)/2+si*(bw+2),y0=y(0),y1=y(v),h=Math.abs(y1-y0),rr=Math.min(4,bw/2,h),top=Math.min(y0,y1);
   const d=v>=0?`M${x},${y0}V${y1+rr}Q${x},${y1} ${x+rr},${y1}H${x+bw-rr}Q${x+bw},${y1} ${x+bw},${y1+rr}V${y0}Z`:`M${x},${y0}V${y1-rr}Q${x},${y1} ${x+rr},${y1}H${x+bw-rr}Q${x+bw},${y1} ${x+bw},${y1-rr}V${y0}Z`;
   marks+=`<path d="${d}" fill="var(--s${si+1})" class="wg-bar"><title>${esc((s.name?s.name+' · ':'')+labels[i])}: ${esc(wgNum(v,unit))}</title></path>`;void top;}));
 }else{
  const xs=i=>L+(n===1?plotW/2:plotW*i/(n-1));
  series.forEach((s,si)=>{const pts=s.vals.map((v,i)=>isFinite(v)?`${xs(i).toFixed(1)},${y(v).toFixed(1)}`:null);let d='',pen=false;pts.forEach(pt=>{if(!pt){pen=false;return;}d+=(pen?'L':'M')+pt;pen=true;});
   marks+=`<path d="${d}" fill="none" stroke="var(--s${si+1})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
   s.vals.forEach((v,i)=>{if(isFinite(v))marks+=`<circle cx="${xs(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${n>14?3:4}" fill="var(--s${si+1})" stroke="var(--raised)" stroke-width="2" class="wg-dot"><title>${esc((s.name?s.name+' · ':'')+labels[i])}: ${esc(wgNum(v,unit))}</title></circle>`;});});
 }
 const legend=k>1?`<div class="wg-legend">${series.map((s,i)=>`<span><i style="background:var(--s${i+1})"></i>${esc(s.name||'Serie '+(i+1))}</span>`).join('')}</div>`:'';
 return `<figure class="wg wg-chart">${head}${legend}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title||'Gráfico')}">${g}${marks}</svg>${wgTable(labels,series,unit)}</figure>`;

/** A small, safe calculator language: numbers, field names, + - * / % ^ ( ) and a few functions. Never eval. */
function calcEval(src,vars){
 const toks=String(src).match(/\d+(?:\.\d+)?(?:e[+-]?\d+)?|[A-Za-z_áéíóúñÁÉÍÓÚÑ][\wáéíóúñÁÉÍÓÚÑ]*|\*\*|[-+*/^%(),]/gi)||[];let i=0;
 const F={min:Math.min,max:Math.max,abs:Math.abs,sqrt:Math.sqrt,floor:Math.floor,ceil:Math.ceil,pow:Math.pow,round:(x,d)=>{const k=Math.pow(10,d||0);return Math.round(x*k)/k;}};
 const peek=()=>toks[i],next=()=>toks[i++];
 const prim=()=>{const t=next();if(t==null)throw 0;if(/^\d/.test(t))return parseFloat(t);if(t==='('){const v=expr();if(next()!==')')throw 0;return v;}
  if(/^[A-Za-z_áéíóúñ]/i.test(t)){if(peek()==='('){next();const args=[];if(peek()!==')'){args.push(expr());while(peek()===','){next();args.push(expr());}}if(next()!==')')throw 0;const f=F[t.toLowerCase()];if(!f)throw 0;return f(...args);}
   if(Object.prototype.hasOwnProperty.call(vars,t))return vars[t];const k=Object.keys(vars).find(x=>x.toLowerCase()===t.toLowerCase());if(k)return vars[k];throw 0;}
  throw 0;};
 const pw=()=>{const b=prim();if(peek()==='^'||peek()==='**'){next();return Math.pow(b,un());}return b;};
 const un=()=>{if(peek()==='-'){next();return -un();}if(peek()==='+'){next();return un();}return pw();};
 const term=()=>{let v=un();while(['*','/','%'].includes(peek())){const o=next(),w=un();v=o==='*'?v*w:o==='/'?v/w:v%w;}return v;};
 const expr=()=>{let v=term();while(peek()==='+'||peek()==='-'){const o=next(),w=term();v=o==='+'?v+w:v-w;}return v;};
 try{const v=expr();return i<toks.length?NaN:v;}catch(e){return NaN;}
}
function calcRun(spec,vals){const vars=Object.assign({},vals);return spec.results.map(r=>{const v=calcEval(r.formula,vars);if(r.id)vars[r.id]=v;return v;});}
const calcFmt=(v,r)=>isFinite(v)?wgNum(Math.round(v*Math.pow(10,r.dec))/Math.pow(10,r.dec),r.unit):'—';
function calcHTML(code,closed){
 if(!closed)return wgWait('Preparando la calculadora…');
 const j=wgParse(code);
 if(!j||!Array.isArray(j.campos)||!Array.isArray(j.resultados)||!j.campos.length||!j.resultados.length)return wgRaw('calculadora',code);
 const fields=j.campos.slice(0,12).map((f,i)=>({id:String((f&&f.id)||'c'+i).replace(/[^\wáéíóúñ]/gi,'').slice(0,30)||'c'+i,label:String((f&&(f.etiqueta||f.label))||'').slice(0,60),value:Number(f&&(f.valor!=null?f.valor:f.value))||0,unit:String((f&&f.unidad)||'').slice(0,8)}));
 const results=j.resultados.slice(0,8).map((r,i)=>({id:String((r&&r.id)||'').replace(/[^\wáéíóúñ]/gi,'').slice(0,30),label:String((r&&(r.etiqueta||r.label))||'Resultado').slice(0,60),formula:String((r&&r.formula)||'').slice(0,300),dec:Math.max(0,Math.min(6,parseInt(r&&r.decimales)||(r&&r.decimales===0?0:2))),unit:String((r&&r.unidad)||'').slice(0,8)}));
 const spec={fields,results},vals={};fields.forEach(f=>{vals[f.id]=f.value;});
 const out=calcRun(spec,vals);
 return `<div class="wg calc-w" data-calc="${esc(JSON.stringify(spec))}">${j.titulo?`<div class="wg-h">${ic('table','sm')}<b>${esc(String(j.titulo).slice(0,120))}</b></div>`:''}<div class="calc-f">${fields.map(f=>`<label><span>${esc(f.label||f.id)}</span><span class="calc-in"><input class="input" type="number" inputmode="decimal" step="any" data-id="${esc(f.id)}" value="${f.value}">${f.unit?`<small>${esc(f.unit)}</small>`:''}</span></label>`).join('')}</div><div class="calc-r">${results.map((r,k)=>`<div class="${k===results.length-1?'main':''}"><span>${esc(r.label)}</span><b data-r="${k}">${calcFmt(out[k],r)}</b></div>`).join('')}</div></div>`;
}
document.addEventListener('input',e=>{

function sharedOf(c){const p=c&&c.projectId?projById(c.projectId):null;return p&&p.shared&&!p.shared.removed?p:null;}
function projCtx(c){const p=c&&c.projectId?projById(c.projectId):null;if(!p)return null;return{name:p.name,instructions:p.instructions||'',files:(p.files||[]).map(f=>f.name),shared:!!(p.shared&&!p.shared.removed),author:myName()};}
function applySpace(p,sp){Object.assign(p,{name:sp.name,desc:sp.desc||'',color:sp.color||p.color,instructions:sp.instructions||'',files:(sp.files||[]).map(f=>({name:f.name,size:f.size||''}))});p.shared=Object.assign(p.shared||{},{id:sp.id,role:sp.role,code:sp.code,members:sp.members||[],owner:sp.owner,updated:sp.updated,removed:false});}
function mergeChats(p,chats){
 let changed=false;
 (chats||[]).forEach(rc=>{
  if(!rc||!rc.id)return;
  const msgs=(rc.messages||[]).map(m=>Object.assign({role:m.role,text:m.text||'',ts:m.ts||rc.updated},m.role==='bot'?{tier:m.tier==='adv'?'adv':'fast',effort:EFF[m.effort]?m.effort:'medio'}:{},m.by?{by:m.by}:{},m.files&&m.files.length?{files:m.files.map(f=>({name:f.name,kind:f.kind||'file'}))}:{},m.sources&&m.sources.length?{sources:m.sources}:{}));
  const c=S.chats.find(x=>x.id===rc.id);
  if(!c){S.chats.push({id:rc.id,title:rc.title||'Chat',mode:rc.mode||'general',projectId:p.id,folderId:null,pinned:false,updated:rc.updated,messages:msgs,by:rc.by});changed=true;return;}
  if(c.projectId!==p.id)return;
  if((rc.updated||0)>(c.updated||0)&&!c.messages.some(m=>m.pending||m.streaming)){c.title=rc.title||c.title;c.messages=msgs;c.updated=rc.updated;c.by=rc.by;changed=true;}
 });
 return changed;
}
async function syncSpace(p,force){
 if(!p||!p.shared||p.shared.removed||!apiReady())return;
 if(!U.server)await serverInfo();if(!spacesReady())return;
 const now=Date.now();if(!force&&p.shared.pulled&&now-p.shared.pulled<12000)return;p.shared.pulled=now;
 try{
  const j=await spacesCall('get',{id:p.shared.id});
  const before=JSON.stringify([p.name,p.desc,p.instructions,p.files,p.shared.members,p.shared.code]);
  applySpace(p,j.space);const moved=mergeChats(p,j.chats);save();
  const same=before===JSON.stringify([p.name,p.desc,p.instructions,p.files,p.shared.members,p.shared.code]);
  if(U.view==='project'&&U.projectId===p.id&&(!same||moved)&&!(document.activeElement&&document.activeElement.id==='projInstr'))renderProject();
  else if(moved&&U.view==='chat'&&!U.streaming){const c=curChat();if(c&&c.projectId===p.id)renderChat();}
  if(!same||moved)renderSidebar();
 }catch(e){if(e.removed){p.shared.removed=true;save();toast(`Ya no eres parte de «${p.name}». Queda una copia en este dispositivo.`);render();}}
}
const pushT={};
function pushChat(c){
 const p=sharedOf(c);if(!p||!spacesReady()||c.temp||p.shared.role==='lector')return;
 clearTimeout(pushT[c.id]);
 pushT[c.id]=setTimeout(async()=>{
  const chat={id:c.id,title:c.title,mode:c.mode,updated:c.updated||Date.now(),messages:c.messages.filter(m=>!m.pending&&!m.streaming&&!m.kind).map(m=>({role:m.role,text:m.text||'',ts:m.ts,tier:m.tier,effort:m.effort,by:m.role==='user'?(m.by||myName()):undefined,files:(m.files||[]).map(f=>typeof f==='string'?{name:f}:{name:f.name,kind:f.kind}),sources:Array.isArray(m.sources)&&m.sources.length&&typeof m.sources[0]==='object'?m.sources:undefined}))};
  try{const j=await spacesCall('chat',{id:p.shared.id,chat});if(j.stale&&mergeChats(p,[j.chat])){save();if(U.view==='chat'&&U.chatId===c.id)renderChat();}}
  catch(e){if(e.removed){p.shared.removed=true;save();}}
 },500);
}
function pushSpace(p,patch){
 if(!p||!p.shared||p.shared.removed||!spacesReady()||p.shared.role==='lector')return;
 const k='p'+p.id;pushT[k+'d']=Object.assign(pushT[k+'d']||{},patch);clearTimeout(pushT[k]);
 pushT[k]=setTimeout(()=>{const all=pushT[k+'d'];pushT[k+'d']=null;spacesCall('update',{id:p.shared.id,patch:all}).then(j=>{applySpace(p,j.space);save();}).catch(()=>{});},700);
}
function shareModal(p){
 if(!p)return;
 const sh=p.shared&&!p.shared.removed?p.shared:null,owner=sh&&sh.role==='owner',ready=spacesReady();
 let body,foot;
 if(!sh){
  body=`<p class="share-lead">Comparte <b>${esc(p.name)}</b> con tu familia o con tu equipo. Verán las instrucciones, los archivos y los chats del proyecto, y podrán escribir en ellos. Cada respuesta de ${MODEL_NAME} les llega a todos.</p>
   ${ready?'':`<div class="notice">${ic('plug')}<div><b>${blockedHere()?'No disponible en esta vista previa':'Necesita el servidor'}</b><span>${blockedHere()?PREVIEW_MSG:'Conecta el servidor (con la pieza HUB) en Administración para compartir de verdad.'}</span></div></div>`}`;
  foot=`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="share-create" data-id="${p.id}" ${ready?'':'disabled'}>${ic('user','sm')}Compartir y crear código</button>`;
 }else{
  body=`${sh.code?`<div class="share-code"><span>Código para unirse</span><b>${esc(sh.code)}</b><div class="share-acts"><button class="btn sm" data-action="share-copy" data-val="${esc(shareLink(sh.code))}">${ic('copy','sm')}Copiar enlace</button><button class="btn sm" data-action="share-newcode" data-id="${p.id}">${ic('refresh','sm')}Código nuevo</button></div><small>Quien abra el enlace o escriba el código en Proyectos › Unirme entra y puede editar. Un código nuevo invalida el anterior.</small></div>`:`<p class="share-lead">Puedes leer este proyecto, pero no escribir en él.</p>`}
   <div class="set-sec">Personas · ${sh.members.length}</div>
   <ul class="share-people">${sh.members.map(m=>`<li><span class="avatar">${esc((m.name||m.email).trim().charAt(0).toUpperCase())}</span><span class="who"><b>${esc(m.name||m.email)}${m.email===myEmail()?' (tú)':''}</b><small>${esc(m.email)}</small></span>${m.role==='owner'?'<span class="role-tag">Creador</span>':owner?`<select class="input sel-sm" data-share-role="${esc(m.email)}" data-id="${p.id}" aria-label="Permiso de ${esc(m.name||m.email)}"><option value="editor" ${m.role==='editor'?'selected':''}>Puede editar</option><option value="lector" ${m.role==='lector'?'selected':''}>Solo leer</option></select><button class="icon-btn" data-action="share-remove" data-id="${p.id}" data-val="${esc(m.email)}" aria-label="Quitar a ${esc(m.name||m.email)}">${ic('x','sm')}</button>`:`<span class="role-tag">${m.role==='lector'?'Solo leer':'Puede editar'}</span>`}</li>`).join('')}</ul>`;
  foot=`<button class="btn danger" data-action="share-leave" data-id="${p.id}">Salir del proyecto</button><span class="grow"></span><button class="btn primary" data-action="close-modal">Listo</button>`;
 }
 modal(`${head(sh?'Proyecto compartido':'Compartir proyecto')}<div class="modal-body">${body}</div><div class="modal-foot">${foot}</div>`,{label:'Compartir proyecto'});
}
function joinModal(code){
 modal(`${head('Unirme a un proyecto')}<form data-form="join-code"><div class="modal-body"><p class="share-lead">Escribe el código que te pasaron o abre el enlace que te enviaron.</p><div class="field"><label for="jc-in">Código</label><input class="input code-in" id="jc-in" name="v" value="${esc(code||'')}" required maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="ABCD2345"></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button class="btn primary">Unirme</button></div></form>`,{label:'Unirme a un proyecto',onOpen:()=>{const i=$('#jc-in');if(i)i.focus();}});
}
async function joinWithCode(code){
 code=String(code||'').trim();if(!code)return;
 if(apiReady()&&!U.server)await serverInfo(true);
 if(!spacesReady()){toast(blockedHere()?PREVIEW_MSG:'Para unirte necesitas el servidor conectado (con la pieza HUB).');return;}
 try{
  const j=await spacesCall('join',{code});
  let p=S.projects.find(x=>x.shared&&x.shared.id===j.space.id);
  if(!p){p={id:'p'+uid(),name:j.space.name,desc:'',color:'#8E8E93',instructions:'',files:[],created:Date.now()};S.projects.push(p);}
  applySpace(p,j.space);mergeChats(p,j.chats);p.shared.pulled=Date.now();save();closeModal();go('project',p.id);toast(`Te uniste a «${p.name}»`);
 }catch(e){toast(e.message||'No pude unirte al proyecto.');}
}

 'share-leave':el=>{const p=projById(el.dataset.id);confirmModal({title:`¿Salir de «${esc(p.name)}»?`,body:'Dejarás de recibir sus cambios. Te queda una copia en este dispositivo.',ok:'Salir',fn:async()=>{try{await spacesCall('leave',{id:p.shared.id});}catch(e){}delete p.shared;save();render();toast('Saliste del proyecto compartido.');}});},
 'proj-add-menu':el=>openPop(el,'projadd',`<button class="menu-opt" role="menuitem" data-action="new-project">${ic('plus')}<span class="mo-t"><b>Nuevo proyecto</b></span></button><button class="menu-opt" role="menuitem" data-action="join-project">${ic('user')}<span class="mo-t"><b>Unirme con un código</b><span>A un proyecto que te compartieron</span></span></button>`),
 'join-project':()=>{closePop();joinModal('');},
});

 const el=e.target.closest('[data-action]');
 const pop=$('.pop');
 if(pop&&!e.target.closest('.pop')&&(!el||el!==U.popAnchor))closePop();
 if(!el)return;

document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,kind=f.dataset.form;
 if(kind==='login'){doLogin(f);return;}
 if(kind==='composer'){send();return;}
 if(kind==='join-code'){joinWithCode(f.elements.v.value);return;}
 if(kind&&kind.startsWith('ld')){ldSubmit(f,kind);return;}
 if(kind==='browser'){const v=f.elements.u.value.trim();if(v){f.elements.u.blur();browse(v);}return;}
 if(kind==='voice-type'){const i=$('#v-input');const v=i?i.value.trim():'';if(!v||!V.on||V.phase==='thinking'||V.phase==='speaking')return;i.value='';V.note='';finishTurn(v);return;}
 if(kind==='rename-chat'){const v=f.elements.v.value.trim();if(!v)return;const c=chatById(f.dataset.id);c.title=v;save();closeModal();renderSidebar();renderTopbar();if(U.view==='project')renderProject();toast('Chat renombrado');return;}
 if(kind==='folder'){const v=f.elements.v.value.trim();if(!v)return;if(f.dataset.id){folderById(f.dataset.id).name=v;toast('Carpeta renombrada');}else{const id='f'+uid();S.folders.push({id,name:v});U.openFolders[id]=true;toast('Carpeta creada');}save();closeModal();renderSidebar();return;}
 if(kind==='project'){const name=f.elements.name.value.trim();if(!name)return;const desc=f.elements.desc.value.trim(),color=f.elements.color.value;closeModal();if(f.dataset.id){const p=projById(f.dataset.id);Object.assign(p,{name,desc,color});save();render();pushSpace(p,{name,desc,color});toast('Proyecto actualizado');}else{const p={id:'p'+uid(),name,desc,color,instructions:'',files:[],created:Date.now()};S.projects.push(p);save();go('project',p.id);toast('Proyecto creado');}return;}
 if(kind==='mem-add'){const v=f.elements.v.value.trim();if(!v)return;S.memories.push({id:uid(),text:v.charAt(0).toUpperCase()+v.slice(1),cat:f.elements.cat.value});save();renderSettings(true);toast('Lithium lo recordará');return;}
 if(kind==='mem-edit'){const v=f.elements.v.value.trim();const m=S.memories.find(x=>x.id===f.dataset.id);if(!v||!m)return;m.text=v;save();closeModal();openSettings('memoria');toast('Recuerdo actualizado');return;}
 if(kind==='mcp'){const name=f.elements.name.value.trim(),url=f.elements.url.value.trim();if(!name){toast('Ponle un nombre al conector.');return;}if(!/^https:\/\/[^\s]+\.[^\s]+/.test(url)){toast('La dirección tiene que empezar por https://');return;}S.customMcp.push({id:'m'+uid(),name,url,on:true});save();renderSettings(true);toast(`Agregaste ${name}`);return;}
 if(kind==='pay-pm'){const ref=f.elements.ref.value.replace(/\D/g,'');if(ref.length<4){toast('Escribe el número de referencia: al menos los últimos 4 dígitos.');f.elements.ref.focus();return;}addPayment('Pago Móvil · '+f.elements.bank.value,bs(payState().amountBs),ref);toast('Recibimos tu comprobante. Lo verificamos en minutos y activamos tu plan.');return;}
 if(kind==='pay-crypto'){const st=payState();addPayment(`${f.dataset.coin} · ${f.dataset.net}`,`${st.price} ${f.dataset.coin}`,f.elements.hash.value.trim().slice(0,16));toast('Gracias. En cuanto la red confirme el pago, activamos tu plan.');return;}
 if(kind==='move'){const c=chatById(f.dataset.id);c.projectId=f.elements.project.value||null;c.folderId=f.elements.folder.value||null;if(c.folderId)U.openFolders[c.folderId]=true;save();closeModal();render();toast('Chat movido');return;}
});

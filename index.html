<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liminal</title>
<meta name="description" content="Tu IA en español, privada y a precio justo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liminal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
:root{
  /* Layout: two-pane shell. A gray sidebar (administración, proyectos, carpetas, chats) beside one conversation column (max 46rem) with the composer docked at the bottom; below 860px the sidebar becomes a drawer. The interface is light and dark gray only; macOS red, yellow and green carry meaning: green = on, healthy, paid; yellow = in progress, near a limit, points; red = errors, stop, destructive. */
  --bg:#F5F5F7; --side:#EBEBEE; --raised:#FFFFFF; --sunk:#EDEDF0;
  --ink:#1D1D1F; --ink-2:#48484A; --ink-3:#6E6E73;
  --line:#D8D8DD; --line-2:#C4C4C9;
  --hover:rgba(0,0,0,.05); --sel:rgba(0,0,0,.08); --seg-on:#FFFFFF; --bubble:#E8E8ED;
  --red:#FF5F57; --yellow:#FEBC2E; --green:#28C840;
  --red-text:#C4302B; --yellow-text:#8A5A00; --green-text:#1A7F2E;
  --red-tint:#FFE6E4; --yellow-tint:#FFF3D9; --green-tint:#DEF5E3;
  --code-bg:#1C1C1E; --code-ink:#E5E5EA; --code-head:#2C2C2E; --code-muted:#98989D;
  --scrim:rgba(0,0,0,.38); --shadow:0 18px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.07);
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Onest","Segoe UI",system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Onest","Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --fs:15px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1C1E; --side:#151517; --raised:#2C2C2E; --sunk:#242426;
    --ink:#F5F5F7; --ink-2:#C7C7CC; --ink-3:#98989D;
    --line:#38383A; --line-2:#48484A;
    --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.1); --seg-on:#3A3A3C; --bubble:#2C2C2E;
    --red-text:#FF7B74; --yellow-text:#FEBC2E; --green-text:#4BD865;
    --red-tint:#3B2321; --yellow-tint:#3A3122; --green-tint:#1F3524;
    --code-bg:#111113; --code-ink:#E5E5EA; --code-head:#1C1C1E; --code-muted:#8E8E93;
    --scrim:rgba(0,0,0,.55); --shadow:0 18px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1C1E; --side:#151517; --raised:#2C2C2E; --sunk:#242426;
  --ink:#F5F5F7; --ink-2:#C7C7CC; --ink-3:#98989D;
  --line:#38383A; --line-2:#48484A;
  --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.1); --seg-on:#3A3A3C; --bubble:#2C2C2E;
  --red-text:#FF7B74; --yellow-text:#FEBC2E; --green-text:#4BD865;
  --red-tint:#3B2321; --yellow-tint:#3A3122; --green-tint:#1F3524;
  --code-bg:#111113; --code-ink:#E5E5EA; --code-head:#1C1C1E; --code-muted:#8E8E93;
  --scrim:rgba(0,0,0,.55); --shadow:0 18px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}.ic.xs{width:13px;height:13px}.ic.lg{width:22px;height:22px}
.ic .f{fill:currentColor;stroke:none}
.grow{flex:1}
.scroll{overflow-y:auto;overscroll-behavior:contain}
.mark{flex:none;fill:currentColor}

/* Sign in */
.auth{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:min(400px,100%);background:var(--raised);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:32px 28px 26px;display:flex;flex-direction:column;gap:18px}
.auth-mark{width:52px;height:52px;color:var(--ink)}
.auth-card h1{margin:0;font-family:var(--font-display);font-weight:650;font-size:1.55rem;letter-spacing:-.02em;line-height:1.2}
.auth-sub{margin:-10px 0 0;color:var(--ink-3)}
.auth form{display:flex;flex-direction:column;gap:14px}
.pw{position:relative}
.pw .input{padding-right:44px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.pw button:hover{background:var(--hover);color:var(--ink)}
.auth-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9em}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink-2)}
.check input{width:17px;height:17px;accent-color:var(--ink);margin:0}
.auth-err{display:flex;gap:9px;align-items:flex-start;margin:0;padding:10px 12px;border-radius:10px;background:var(--red-tint);color:var(--ink);font-size:.9em}
.auth-err .dotc{margin-top:6px}
.btn.block{width:100%;height:44px;font-size:.98em}
.auth-foot{margin:0;text-align:center;font-size:.9em;color:var(--ink-3)}
.auth-note{margin:0;max-width:400px;text-align:center;font-size:.78rem;color:var(--ink-3)}
.dotc{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dotc.g{background:var(--green)}.dotc.y{background:var(--yellow)}.dotc.r{background:var(--red)}

/* Shell */
.app{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;transition:grid-template-columns .22s ease}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
.app.collapsed .sidebar{visibility:hidden}
.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;position:relative}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:45}

/* Sidebar */
.sb-head{display:flex;align-items:center;gap:8px;height:40px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);border-radius:8px}
.brand .mark{width:22px;height:22px}
.wordmark{font-family:var(--font-display);font-weight:650;font-size:1.2rem;letter-spacing:-.02em;line-height:1}
.demo-pill{font-size:.72rem;font-weight:500;color:var(--yellow-text);background:var(--yellow-tint);padding:2px 8px;border-radius:99px}
.sb-close,.sb-collapse{margin-left:auto}
.new-chat{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;border-radius:12px;background:var(--raised);border:1px solid var(--line);font-weight:500;color:var(--ink)}
.new-chat:hover{border-color:var(--line-2)}
.new-chat kbd{margin-left:auto;font:500 .72rem var(--font-ui);color:var(--ink-3)}
.sb-search{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;margin-top:6px;border-radius:10px;color:var(--ink-2);font-size:.92em}
.sb-search:hover{background:var(--hover);color:var(--ink)}
.sb-search.active{background:var(--sel);color:var(--ink);font-weight:500}
.sb-scroll{flex:1;overflow-y:auto;margin:4px -6px 0;padding:0 6px 8px}
.sb-label{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;font-size:.78rem;color:var(--ink-3);font-weight:500}
.sb-label button{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.sb-label button:hover{background:var(--hover);color:var(--ink)}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;min-height:34px;padding:6px 10px;border-radius:9px;color:var(--ink-2);font-size:.92em}
.sb-item:hover{background:var(--hover);color:var(--ink)}
.sb-item.active,.sb-chat.active .sb-item{background:var(--sel);color:var(--ink);font-weight:500}
.sb-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .count{font-size:.8em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.sb-chat{position:relative;display:flex;align-items:center}
.sb-chat .sb-item{padding-right:34px}
.sb-chat .more{position:absolute;right:3px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3);opacity:0}
.sb-chat:hover .more,.sb-chat.active .more,.sb-chat .more:focus-visible{opacity:1}
.sb-chat .more:hover{background:var(--hover);color:var(--ink)}
@media (hover:none){.sb-chat .more{opacity:.75}}
.folder-kids{margin-left:14px;padding-left:8px;border-left:1px solid var(--line)}
.chev-rot{transition:transform .15s}
.open>.chev-rot{transform:rotate(90deg)}
.sb-group{padding:10px 10px 2px;font-size:.74rem;color:var(--ink-3)}
.sb-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.usage-mini{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:10px;text-align:left}
.usage-mini:hover{background:var(--hover)}
.usage-mini .um-top{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.usage-mini .um-sub{font-size:.74rem;color:var(--ink-3)}
.meter{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.sidebar .meter{background:var(--line)}
.meter>i{display:block;height:100%;background:var(--green);border-radius:inherit}
.meter.warn>i{background:var(--yellow)}
.meter.hot>i{background:var(--red)}
.profile{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left}
.profile:hover{background:var(--hover)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:600;flex:none}
.profile .pn{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.92em;line-height:1.25}
.profile .pp{display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--ink-3)}
.profile .pp .ic{color:var(--yellow-text)}
.role{font-size:.68rem;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--sel);color:var(--ink-2)}

/* Top bar */
.topbar{display:flex;align-items:center;gap:6px;min-height:56px;flex:none;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.model-btn{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-radius:10px;min-width:0}
.model-btn:hover,.model-btn[aria-expanded="true"]{background:var(--hover)}
.model-btn .mb-name{font-weight:600}
.model-btn .mb-sub{color:var(--ink-3);font-size:.88em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.92em;color:var(--ink-2)}
.tb-title .crumb-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36ch;color:var(--ink)}
.tb-title .crumb-p{color:var(--ink-3);border-radius:6px;padding:2px 4px;white-space:nowrap}
.tb-title .crumb-p:hover{color:var(--ink);background:var(--hover)}
.tb-title .crumb-sep{color:var(--line-2)}
.pill-toggle{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);font-size:.88em}
.pill-toggle:hover{border-color:var(--line-2);color:var(--ink)}
.pill-toggle.on{background:var(--ink);color:var(--bg);border-color:transparent}

/* Views */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding-block:12px 40px}
.home-inner{width:100%;max-width:46rem;margin:auto 0;display:flex;flex-direction:column;gap:22px}
.hero{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.hero .mark{width:60px;height:60px;color:var(--ink);overflow:visible}
.mk-l{animation:mkl .9s cubic-bezier(.2,.75,.2,1) both}
.mk-b{animation:mkb .9s cubic-bezier(.2,.75,.2,1) .08s both}
.mk-7{animation:mk7 .9s cubic-bezier(.2,.75,.2,1) .16s both}
@keyframes mkl{from{transform:translate(-90px,90px)}}
@keyframes mkb{from{transform:translate(0,-110px)}}
@keyframes mk7{from{transform:translate(110px,-60px)}}
@media (prefers-reduced-motion:reduce){.mk-l,.mk-b,.mk-7{animation:none}}
.greet{font-family:var(--font-display);font-weight:650;font-size:clamp(1.75rem,4.2vw,2.35rem);line-height:1.15;margin:0;letter-spacing:-.025em;text-wrap:balance}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:.92em}
.notice b{display:block;font-weight:600}
.notice span{color:var(--ink-2)}
.notice .ic{margin-top:2px;color:var(--ink-2)}
.notice.warn{background:var(--yellow-tint)}
.notice.warn .ic{color:var(--yellow-text)}
.notice .btn{margin-left:auto;align-self:center}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mode-card{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:14px;border:1px solid var(--line);background:transparent;text-align:left;min-width:0}
.mode-card:hover{background:var(--raised);border-color:var(--line-2)}
.mode-card .ic{color:var(--ink-2);margin-bottom:6px}
.mode-card b{font-weight:600;font-size:.95em}
.mode-card span{font-size:.84em;color:var(--ink-3);line-height:1.4}
.mode-card.on{border-color:var(--ink);background:var(--raised)}
.mode-card.on .ic{color:var(--ink)}

/* Composer */
.composer{background:var(--raised);border:1px solid var(--line-2);border-radius:22px;padding:12px 10px 8px 16px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.composer:focus-within{border-color:var(--ink-3)}
.composer textarea{border:0;outline:0;resize:none;background:transparent;width:100%;min-height:26px;max-height:220px;line-height:1.5;padding:2px 2px 4px;font-size:1em}
.composer textarea::placeholder{color:var(--ink-3)}
.composer-bar{display:flex;align-items:center;gap:6px;margin-left:-6px}
.mode-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);font-size:.86em;white-space:nowrap}
.mode-chip:hover{border-color:var(--line-2);color:var(--ink)}
.mode-chip.set{background:var(--sel);border-color:transparent;color:var(--ink)}
.send{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;transition:transform .1s}
.send:active{transform:scale(.94)}
.send:disabled{background:var(--sunk);color:var(--ink-3);cursor:default}
.att-row{display:flex;flex-wrap:wrap;gap:6px}
.att{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 6px 4px 10px;border-radius:10px;background:var(--sunk);font-size:.84em}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.att button{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3)}
.att button:hover{background:var(--hover);color:var(--ink)}
.fineprint{margin:8px 0 0;text-align:center;font-size:.76rem;color:var(--ink-3)}

/* Thread */
.thread{flex:1;min-height:0}
.thread-inner{max-width:46rem;margin:0 auto;padding-block:12px 28px;display:flex;flex-direction:column;gap:30px}
.app.compact .thread-inner{gap:18px}
.dock{flex:none;padding-block:0 12px}
.dock-inner{max-width:46rem;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.msg{min-width:0}
.msg.user{align-self:flex-end;max-width:min(85%,36rem);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bubble{background:var(--bubble);padding:10px 15px;border-radius:20px 20px 6px 20px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-files{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.msg.bot{display:flex;flex-direction:column;gap:8px}
.bot-head{display:flex;align-items:center;gap:8px;font-size:.82em;color:var(--ink-3);flex-wrap:wrap}
.bot-head b{color:var(--ink);font-weight:600}
.gen{position:relative;margin:10px 0 0;border-radius:16px;overflow:hidden;background:var(--sunk);max-width:420px;border:1px solid var(--line)}
.gen-art{overflow:hidden}
.gen.image .gen-art{aspect-ratio:1/1}
.gen.video .gen-art{aspect-ratio:16/9}
.gen-art svg{display:block;width:100%;height:100%}
.gen.video .gen-art svg{animation:genpan 6s ease-in-out infinite alternate;transform-origin:center}
@keyframes genpan{from{transform:scale(1)}to{transform:scale(1.12) translate(-3%,-2%)}}
.gen-play{position:absolute;left:50%;top:calc(50% - 16px);transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff}
.gen-tag{position:absolute;right:10px;top:10px;font-size:.75em;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff}
.gen figcaption{font-size:.78em;color:var(--ink-3);padding:8px 12px}
@media (prefers-reduced-motion:reduce){.gen.video .gen-art svg{animation:none}}
.composer-bar{flex-wrap:wrap;row-gap:6px}
.att.rich{padding:5px 6px 5px 6px;gap:8px;max-width:260px}
.att.rich img{width:30px;height:30px;border-radius:7px;object-fit:cover;flex:none}
.att.rich .ic{flex:none}
.att-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.att-t b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-t small{color:var(--ink-3);font-size:.86em;white-space:nowrap}
.att.err .att-t small{color:var(--red-text)}
.tool-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 10px;border-radius:99px;background:var(--sel);color:var(--ink);font-size:.86em;white-space:nowrap}
.tool-chip button{width:24px;height:24px;border-radius:99px;display:grid;place-items:center;color:var(--ink-3)}
.tool-chip button:hover{background:var(--hover);color:var(--ink)}
.rec-bar{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--red-tint);font-size:.9em}
.rec-dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:recpulse 1s ease-in-out infinite alternate}
@keyframes recpulse{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.rec-dot{animation:none}}
.sources{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:.82em;color:var(--ink-3)}
.src{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--ink-2);text-decoration:none}
.src:hover{color:var(--ink)}
.mem-chip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--sunk);font-size:.84em;color:var(--ink-2)}
.mem-chip .ic{color:var(--green)}
.edited-tag{font-size:.9em;color:var(--ink-3)}
.modal.editor{width:min(820px,100%);height:min(760px,100%);display:flex;flex-direction:column}
.ed-tools{display:flex;align-items:center;gap:6px;padding:8px 14px 10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-tools .grow{flex:1}
.ed-area{flex:1;overflow:auto;padding:18px 24px;outline:0;line-height:1.6}
.ed-area:focus-visible{box-shadow:inset 0 0 0 2px var(--line-2)}
.ed-area h3,.ed-area h4{font-size:1.05em;margin:1em 0 .4em}
.modal.editor .modal-foot{padding-top:12px;border-top:1px solid var(--line)}
.oauth{display:flex;flex-direction:column;gap:8px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:.82em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.pay-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pay-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);font-size:.82em;color:var(--ink-2);text-align:center}
.pay-tab[aria-checked="true"]{border-color:var(--ink);color:var(--ink);background:var(--sunk);font-weight:500}
.pay-amount{padding:14px;border-radius:12px;background:var(--sunk)}
.pay-amount b{display:block;font-size:1.5em;font-weight:600;font-variant-numeric:tabular-nums}
.pay-amount span{font-size:.86em;color:var(--ink-2)}
.pay-data{display:flex;flex-direction:column;gap:8px}
.pay-line{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.pay-line span{color:var(--ink-3);font-size:.84em}
.pay-line b{font-weight:500;font-variant-numeric:tabular-nums;word-break:break-all}
.conn-ic{width:34px;height:34px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.conn-row{display:flex;align-items:center;gap:12px}
.mem-cat{font-size:.78rem;color:var(--ink-3);font-weight:500;margin:14px 0 6px}
.form-inline{display:flex;gap:8px;flex-wrap:wrap}
.form-inline .input{flex:1 1 200px}
.bot-head .mark{width:15px;height:15px;color:var(--ink)}
.md{line-height:1.68;overflow-wrap:anywhere}
.app.compact .md{line-height:1.55}
.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .85em}
.md h4{font-size:1.02em;font-weight:600;margin:1.15em 0 .4em}
.md h4:first-child{margin-top:0}
.md ul,.md ol{margin:0 0 .9em;padding-left:1.35em}
.md li{margin:.3em 0}
.md li::marker{color:var(--ink-3)}
.md strong{font-weight:600}
.md blockquote{margin:0 0 .9em;padding:.15em 0 .15em 14px;border-left:3px solid var(--line-2);color:var(--ink-2)}
.md code{font-family:var(--font-mono);font-size:.86em;background:var(--sunk);padding:.1em .35em;border-radius:5px}
.md .code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;overflow:hidden;margin:0 0 .9em}
.md .code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;background:var(--code-head);font-size:.78em;color:var(--code-muted)}
.md .code-head button{color:var(--code-muted);padding:3px 8px;border-radius:6px}
.md .code-head button:hover{color:var(--code-ink)}
.md pre{margin:0;padding:12px 14px;overflow-x:auto}
.md pre code{background:none;padding:0;font-size:.86em;line-height:1.6;color:inherit}
.caret{display:inline-block;width:8px;height:1.05em;vertical-align:-2px;margin-left:2px;background:var(--ink-2);border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.msg-actions{display:flex;gap:2px;margin-left:-6px}
.msg.user .msg-actions{margin:0 -6px 0 0;opacity:0;transition:opacity .15s}
.msg.user:hover .msg-actions,.msg.user .msg-actions:focus-within{opacity:1}
@media (hover:none){.msg.user .msg-actions{opacity:1}}
.act{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.act:hover{background:var(--hover);color:var(--ink)}
.act.on{color:var(--ink)}
.act.on.up{color:var(--green-text)}
.act.on.down{color:var(--red-text)}
.act .flip{transform:rotate(180deg)}
.think{border:1px solid var(--line);border-radius:12px;font-size:.88em;color:var(--ink-2)}
.think summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-radius:12px}
.think summary::-webkit-details-marker{display:none}
.think summary:hover{color:var(--ink)}
.think summary .chev-rot{margin-left:auto}
.think[open] summary .chev-rot{transform:rotate(90deg)}
.think-body{padding:0 14px 12px 38px;display:flex;flex-direction:column;gap:6px;color:var(--ink-3)}
.thinking-live{display:flex;align-items:center;gap:10px;font-size:.9em;color:var(--ink-2)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--yellow);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pulse,.caret{animation:none}}

/* Project */
.project{flex:1;min-height:0}
.project-inner{max-width:62rem;margin:0 auto;padding-block:8px 40px;display:flex;flex-direction:column;gap:22px}
.proj-head{display:flex;align-items:flex-start;gap:14px}
.proj-dot{width:14px;height:14px;border-radius:4px;margin-top:12px;flex:none}
.proj-title{flex:1;min-width:0}
.proj-title h1,.page-h1{font-family:var(--font-display);font-weight:650;font-size:clamp(1.6rem,4vw,2.05rem);letter-spacing:-.025em;line-height:1.2;margin:0;text-wrap:balance}
.proj-title p,.page-sub{margin:4px 0 0;color:var(--ink-3)}
.proj-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.proj-chats h2{font-size:.95em;font-weight:600;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.proj-chats h2 .count{color:var(--ink-3);font-weight:400}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.row{display:flex;flex-direction:column;gap:2px;width:100%;padding:12px 8px;text-align:left;border-radius:8px}
.row:hover{background:var(--hover)}
.row-t{font-weight:500}
.row-m{font-size:.84em;color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:.92em}
.proj-side{display:flex;flex-direction:column;gap:14px}
.panel{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--raised)}
.panel-h{display:flex;align-items:center;justify-content:space-between}
.panel h3{margin:0;font-size:.92em;font-weight:600}
.panel small{color:var(--ink-3);font-size:.78rem}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.files li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px}
.files .fn{flex:1;min-width:0;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files .fs{font-size:.76rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.files .ic{color:var(--ink-3)}
.link-btn{display:inline-flex;align-items:center;gap:5px;font-size:.9em;color:var(--ink);font-weight:500;padding:3px 4px;border-radius:7px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.link-btn:hover{text-decoration-color:var(--ink)}

/* Admin */
.admin{flex:1;min-height:0}
.admin-inner{max-width:72rem;margin:0 auto;padding-block:8px 48px;display:flex;flex-direction:column;gap:22px}
.admin-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .tl{font-size:.84em;color:var(--ink-3)}
.tile .tv{font-family:var(--font-display);font-size:1.75rem;font-weight:650;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .ts{font-size:.8em;color:var(--ink-3)}
.admin-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.svc{list-style:none;margin:0;padding:0}
.svc li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.svc li:last-child{border-bottom:0}
.svc .sn{flex:1;min-width:0}
.svc .sn b{display:block;font-weight:500;font-size:.94em}
.svc .sn span{display:block;font-size:.8em;color:var(--ink-3)}
.chip-s{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:.8em;font-weight:500;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .search-in{flex:1 1 220px;max-width:340px}
.calc{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;background:var(--sunk)}
.calc b{font-family:var(--font-display);font-size:1.4rem;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.calc span{font-size:.84em;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.muted{color:var(--ink-3)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);font-weight:500;font-size:.92em;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{height:32px;padding:0 12px;font-size:.86em}
.btn.primary{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--red-text);border-color:var(--red-text)}
.btn.danger:hover{background:var(--red-tint)}
.btn.danger.solid{background:var(--red-text);color:var(--raised);border-color:transparent}
.input{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:9px 12px;outline:0;min-width:0}
.input:focus{border-color:var(--ink-3)}
.input[aria-invalid="true"]{border-color:var(--red-text)}
textarea.input{resize:vertical;line-height:1.5}
select.input{appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lb{font-size:.86em;color:var(--ink-2);font-weight:500}
.field .hint{font-size:.78rem;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:6px 12px;border-radius:8px;font-size:.86em;color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg.full{display:flex}
.seg.full button{flex:1}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* Popovers */
.pop{position:fixed;z-index:60;background:var(--raised);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;width:max-content;min-width:230px;max-width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow-y:auto;animation:popin .12s ease}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}}
.menu-title,.menu-label{padding:8px 10px 4px;font-size:.78rem;color:var(--ink-3);font-weight:500}
.menu-label{padding-top:6px}
.menu-opt{display:flex;gap:11px;align-items:flex-start;width:100%;padding:9px 10px;border-radius:9px;text-align:left}
.menu-opt:hover{background:var(--hover)}
.menu-opt .ic{margin-top:2px;color:var(--ink-2)}
.menu-opt .mo-t{flex:1;min-width:0}
.menu-opt b{display:block;font-weight:500}
.menu-opt span{display:block;font-size:.82em;color:var(--ink-3);line-height:1.4}
.menu-opt .chk{color:var(--ink)}
.menu-opt.danger,.menu-opt.danger .ic{color:var(--red-text)}
.menu-sep{height:1px;background:var(--line);margin:6px 4px}
.menu-pad{padding:0 10px 8px}
.menu-note{margin:8px 0 0;font-size:.8em;color:var(--ink-3)}

/* Modals */
.backdrop{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--raised);border-radius:18px;width:min(460px,100%);max-height:100%;overflow:auto;border:1px solid var(--line);box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 14px 6px 20px}
.modal-head h2{margin:0;font-size:1.08em;font-weight:600}
.modal-body{padding:6px 20px 18px;display:flex;flex-direction:column;gap:14px}
.modal-body p{margin:0;color:var(--ink-2)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 20px;flex-wrap:wrap}
.modal.search-modal{width:min(620px,100%);align-self:start;margin-top:8vh}
.search-bar{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.search-bar .ic{color:var(--ink-3)}
.search-input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:1.02em;padding:6px 0}
.search-res{padding:8px;max-height:60vh;overflow-y:auto}
.sr-item{display:flex;gap:12px;align-items:flex-start;width:100%;padding:10px;border-radius:10px;text-align:left}
.sr-item:hover,.sr-item:focus-visible{background:var(--hover)}
.sr-item .ic{margin-top:3px;color:var(--ink-3)}
.sr-item b{display:block;font-weight:500}
.sr-item span{display:block;font-size:.84em;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:48ch}
.sr-item mark{background:var(--yellow-tint);color:inherit;border-radius:3px}
.sr-empty{padding:24px 12px;text-align:center;color:var(--ink-3)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.color-opt{width:30px;height:30px;border-radius:9px;border:2px solid transparent;outline-offset:2px}
.color-opt[aria-checked="true"]{border-color:var(--ink)}

/* Settings */
.modal.settings{width:min(880px,100%);height:min(660px,100%);display:grid;grid-template-columns:220px minmax(0,1fr);overflow:hidden}
.set-nav{background:var(--sunk);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;border-right:1px solid var(--line)}
.set-nav-title{font-family:var(--font-display);font-weight:650;font-size:1.2rem;letter-spacing:-.02em;padding:0 10px 12px}
.set-tab{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;color:var(--ink-2);font-size:.92em;text-align:left}
.set-tab:hover{background:var(--hover);color:var(--ink)}
.set-tab[aria-selected="true"]{background:var(--seg-on);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.set-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.set-head{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 12px 28px;border-bottom:1px solid var(--line)}
.set-head h2{margin:0;font-size:1.12em;font-weight:600}
.set-body{flex:1;overflow-y:auto;padding:8px 28px 28px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.set-row.stack{flex-direction:column;align-items:stretch;gap:10px}
.set-text{min-width:0;flex:1 1 220px}
.set-text b{display:block;font-weight:500}
.set-text span{display:block;font-size:.86em;color:var(--ink-3);margin-top:2px}
.set-sec{font-size:.8rem;color:var(--ink-3);font-weight:500;margin:24px 0 0}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:.84em;color:var(--green-text);font-weight:500;white-space:nowrap}
.theme-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme-card{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;text-align:left;font-size:.88em}
.theme-card:hover{border-color:var(--line-2)}
.theme-card[aria-checked="true"]{border-color:var(--ink)}
.tc-prev{height:62px;border-radius:8px;display:grid;grid-template-columns:30% 1fr;overflow:hidden;border:1px solid var(--line)}
.tc-prev i{display:block}
.tc-prev .tc-main{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:8px}
.tc-prev .tc-main i{height:6px;border-radius:3px}
.mem-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mem-list li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--sunk);font-size:.9em}
.mem-list li span{flex:1;min-width:0}
.plan-card{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--sunk);margin-top:16px}
.plan-card .pc-t{flex:1;min-width:200px}
.plan-card b{display:block;font-size:1.05em}
.plan-card span{color:var(--ink-2);font-size:.9em}
.price{font-family:var(--font-display);font-weight:650;font-size:1.6rem;letter-spacing:-.02em;line-height:1}
.price small{font-family:var(--font-ui);font-weight:400;font-size:.85rem;color:var(--ink-3)}
.meters{display:flex;flex-direction:column;gap:16px;padding:14px 0 4px}
.mt-top{display:flex;justify-content:space-between;gap:10px;font-size:.9em;margin-bottom:6px}
.mt-top b{font-weight:500}
.mt-top span{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.mt-sub{font-size:.78rem;color:var(--ink-3);margin-top:5px}
.tbl-wrap{overflow-x:auto;margin-top:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:.88em;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:500;color:var(--ink-3);padding:8px 14px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl .num{text-align:right}
.tbl td.user b{display:flex;align-items:center;gap:6px;font-weight:500}
.tbl td.user span{display:block;font-size:.88em;color:var(--ink-3)}
.points-hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:18px}
.points-hero .big{font-family:var(--font-display);font-weight:650;font-size:3rem;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.points-hero .ic{color:var(--yellow-text);align-self:center}
.copy-field{display:flex;gap:8px}
.copy-field .input{font-family:var(--font-mono);font-size:.88em}
.steps{margin:6px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.code-chip{font-family:var(--font-mono);font-weight:500;background:var(--sunk);padding:2px 8px;border-radius:6px}
.status{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--sunk);margin-top:16px}
.status .grow{font-size:.92em}

/* Toast */

async function readAttachment(a,file){

  if(a.kind==='pdf'){

   const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;a.pages=doc.numPages;let text='';
   for(let i=1;i<=Math.min(doc.numPages,20)&&text.length<8000;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n';}
   a.text=text.replace(/[ \t]+/g,' ').trim().slice(0,8000);
  }else if(a.kind==='doc'){await loadLib('mammoth');const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});a.text=r.value.trim().slice(0,8000);}

function blocksFromMd(src){const out=[];String(src).split('\n').forEach(l=>{const t=l.trim();if(!t||t.startsWith('```'))return;let m;if((m=t.match(/^#{1,4}\s+(.*)/)))out.push({t:'h',x:m[1]});else if((m=t.match(/^[-*•]\s+(.*)/)))out.push({t:'li',x:m[1]});else if((m=t.match(/^(\d+)[.)]\s+(.*)/)))out.push({t:'li',x:m[2],n:+m[1]});else if(t.startsWith('>'))out.push({t:'q',x:t.replace(/^>\s?/,'')});else out.push({t:'p',x:t});});return out.map(b=>Object.assign(b,{x:b.x.replace(/\*\*([^*]+)\*\*/g,'$1').replace(/\*([^*]+)\*/g,'$1').replace(/`([^`]+)`/g,'$1')})).filter(b=>b.x);}
function blocksFromHtml(root){const out=[];const txt=n=>(n.innerText||n.textContent||'').replace(/\u00a0/g,' ').trim();root.childNodes.forEach(n=>{if(n.nodeType===3){const x=n.textContent.trim();if(x)out.push({t:'p',x});return;}if(n.nodeType!==1)return;const tag=n.tagName;if(/^H[1-6]$/.test(tag))out.push({t:'h',x:txt(n)});else if(tag==='UL'||tag==='OL'){let k=0;Array.from(n.children).forEach(li=>{k++;out.push({t:'li',x:txt(li),n:tag==='OL'?k:null});});}else if(tag==='BLOCKQUOTE')out.push({t:'q',x:txt(n)});else if((tag==='DIV'||tag==='SECTION')&&n.querySelector('ul,ol,h1,h2,h3,h4,blockquote,p,div'))out.push(...blocksFromHtml(n));else if(tag!=='BR'){const x=txt(n);if(x)out.push({t:'p',x});}});return out.filter(b=>b.x);}
function mdFromBlocks(blocks){return blocks.map(b=>b.t==='h'?'### '+b.x:b.t==='li'?(b.n?b.n+'. ':'- ')+b.x:b.t==='q'?'> '+b.x:b.x).join('\n\n').replace(/\n\n(- |\d+\. )/g,'\n$1');}

/* Markdown (subset) */
function inline(t){return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)]|$)/g,'$1<em>$2</em>');}
function md(src){
 const L=String(src).replace(/\r/g,'').split('\n');let out='',i=0,list=null,para=[],quote=null;
 const fp=()=>{if(para.length){out+='<p>'+para.map(inline).join('<br>')+'</p>';para=[];}};
 const fl=()=>{if(list){out+=`<${list.t}>`+list.items.map(x=>'<li>'+inline(x)+'</li>').join('')+`</${list.t}>`;list=null;}};
 const fq=()=>{if(quote){out+='<blockquote>'+quote.map(q=>q?inline(q):'').join('<br>').replace(/(<br>){2,}/g,'<br><br>')+'</blockquote>';quote=null;}};
 const flush=()=>{fp();fl();fq();};
 while(i<L.length){
  const l=L[i];let m;
  if(l.startsWith('```')){flush();const lang=l.slice(3).trim();const code=[];i++;while(i<L.length&&!L[i].startsWith('```')){code.push(L[i]);i++;}i++;out+=`<div class="code"><div class="code-head"><span>${esc(lang||'texto')}</span><button type="button" data-action="copy-code">Copiar</button></div><pre><code>${esc(code.join('\n'))}</code></pre></div>`;continue;}
  if((m=l.match(/^#{1,4}\s+(.*)/))){flush();out+=`<h4>${inline(m[1])}</h4>`;i++;continue;}
  if((m=l.match(/^>\s?(.*)/))){fp();fl();(quote=quote||[]).push(m[1]);i++;continue;}
  if((m=l.match(/^\s*[-•]\s+(.*)/))){fp();fq();if(!list||list.t!=='ul'){fl();list={t:'ul',items:[]};}list.items.push(m[1]);i++;continue;}
  if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){fp();fq();if(!list||list.t!=='ol'){fl();list={t:'ol',items:[]};}list.items.push(m[1]);i++;continue;}
  if(!l.trim()){flush();i++;continue;}
  fl();fq();para.push(l);i++;
 }
 flush();return out;
}

function readGuard(){try{return JSON.parse(store.get(GUARD_KEY))||{fails:0,until:0};}catch(e){return {fails:0,until:0};}}
function writeGuard(g){store.set(GUARD_KEY,JSON.stringify(g));}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function readSession(){
 for(const sess of [false,true]){try{const s=JSON.parse(store.get(SESSION_KEY,sess));if(s&&s.exp>Date.now())return s;}catch(e){}}

}

 clearInterval(lockTimer);
 if(locked){lockTimer=setInterval(()=>{const b=$('#lg-btn');const left=readGuard().until-Date.now();if(!b){clearInterval(lockTimer);return;}if(left<=0){clearInterval(lockTimer);b.disabled=false;b.textContent='Iniciar sesión';}else b.textContent=`Espera ${Math.ceil(left/1000)} s`;},500);}

async function doLogin(form){
 const email=form.elements.email.value.trim().toLowerCase(),pass=form.elements.password.value,remember=form.elements.remember.checked;
 const g=readGuard();
 if(g.until>Date.now()){renderAuth({msg:'Demasiados intentos. Espera unos segundos y vuelve a probar.'},email);return;}
 if(!email)return showAuth({field:'email',msg:'Escribe tu correo.'},email);
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showAuth({field:'email',msg:'Ese correo no parece válido. Revisa que tenga @ y un dominio.'},email);
 if(!pass)return showAuth({field:'password',msg:'Escribe tu contraseña.'},email);
 if(!(window.crypto&&crypto.subtle))return showAuth({msg:'Este navegador no puede verificar la contraseña. Abre la página con https.'},email);
 const btn=$('#lg-btn');if(btn){btn.disabled=true;btn.textContent='Verificando…';}
 const h=await sha256(pass);
 if(email===ADMIN.email&&h===ADMIN.hash){
  writeGuard({fails:0,until:0});
  SESSION={email:ADMIN.email,name:ADMIN.name,role:ADMIN.role,at:Date.now(),exp:Date.now()+(remember?30*D:12*H)};
  store.del(SESSION_KEY);store.set(SESSION_KEY,JSON.stringify(SESSION),!remember);
  startApp();toast(`Hola, ${ADMIN.name}. Entraste como administrador.`);return;
 }
 g.fails=(g.fails||0)+1;
 if(g.fails>=MAX_TRIES){g.fails=0;g.until=Date.now()+LOCK_MS;writeGuard(g);return showAuth({msg:'Demasiados intentos fallidos. Espera 30 segundos y vuelve a probar.'},email);}
 writeGuard(g);
 const left=MAX_TRIES-g.fails;
 showAuth({field:'password',msg:`Correo o contraseña incorrectos. Te ${left===1?'queda 1 intento':`quedan ${left} intentos`} antes de una pausa de 30 segundos.`},email);
}

function msgHTML(m,i,c){
 if(m.role==='user'){
  return `<div class="msg user" data-i="${i}">${m.files&&m.files.length?`<div class="msg-files">${m.files.map(f=>typeof f==='string'?`<span class="att">${ic('file','sm')}<span>${esc(f)}</span></span>`:attHTML(f,null,false,i)).join('')}</div>`:''}<div class="bubble">${esc(m.text)}</div>${m.spoken?`<span class="spoken-tag">${ic('wave','xs')}Dicho en voz alta</span>`:''}<div class="msg-actions"><button class="act" data-action="copy-msg" data-i="${i}" aria-label="Copiar mensaje">${ic('copy','sm')}</button><button class="act" data-action="edit-msg" data-i="${i}" aria-label="Editar y volver a enviar">${ic('edit','sm')}</button></div></div>`;
 }
 const isLast=i===c.messages.length-1;
 if(m.kind){
  const spec=CREATE[m.kind];
  const body=m.pending?`<div class="thinking-live"><span class="pulse"></span>${spec.pending}</div>`:`<div class="md"><p>${esc(m.text)}</p></div>${m.stopped?'':mediaHTML(m)}`;
  const acts=m.pending||m.stopped?'':`<div class="msg-actions"><button class="act" data-action="dl-media" aria-label="Descargar">${ic('download','sm')}</button><button class="act" data-action="copy-msg" data-i="${i}" aria-label="Copiar la descripción">${ic('copy','sm')}</button>${isLast?`<button class="act" data-action="regen" aria-label="Crear otra versión">${ic('refresh','sm')}</button>`:''}</div>`;
  return `<div class="msg bot" data-i="${i}"><div class="bot-head">${mark()}<b>${MODEL_NAME}</b><span>${esc(spec.name)} · ${spec.credits} ${creditWord(spec.credits)}</span></div>${body}${acts}</div>`;
 }
 let think='';
 if(m.pending)think=`<div class="thinking-live"><span class="pulse"></span>${m.web?'Buscando en internet…':m.reading?'Leyendo tus archivos…':m.tier==='adv'?`Pensando con esfuerzo ${EFF[m.effort].name.toLowerCase()}…`:'Escribiendo…'}</div>`;
 else if(m.thinking&&S.prefs.showThinking)think=`<details class="think"><summary>${ic('brain','sm')}Razonó durante ${m.thinking} s${ic('chevr','xs chev-rot')}</summary><div class="think-body">${(m.thought||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div></details>`;
 const actions=(!m.pending&&!m.streaming)?`<div class="msg-actions"><button class="act" data-action="copy-msg" data-i="${i}" aria-label="Copiar respuesta">${ic('copy','sm')}</button><button class="act" data-action="export-menu" data-i="${i}" aria-haspopup="true" aria-label="Exportar o editar">${ic('download','sm')}</button>${isLast?`<button class="act" data-action="regen" aria-label="Volver a generar">${ic('refresh','sm')}</button>`:''}<button class="act up ${m.fb==='up'?'on':''}" data-action="fb" data-i="${i}" data-val="up" aria-label="Buena respuesta" aria-pressed="${m.fb==='up'}">${ic('thumb','sm')}</button><button class="act down ${m.fb==='down'?'on':''}" data-action="fb" data-i="${i}" data-val="down" aria-label="Mala respuesta" aria-pressed="${m.fb==='down'}">${ic('thumb','sm flip')}</button></div>`:'';
 return `<div class="msg bot" data-i="${i}"><div class="bot-head">${mark()}<b>${MODEL_NAME}</b><span>${esc(metaOf(m))}</span>${m.edited?'<span class="edited-tag">· editado</span>':''}</div>${think}${m.pending?'':`<div class="md">${md(m.text)}${m.streaming?'<span class="caret" aria-hidden="true"></span>':''}</div>`}${!m.pending&&!m.streaming&&m.sources?`<div class="sources"><span>Fuentes (demostración)</span>${m.sources.map(d=>`<a class="src" href="https://${d}" target="_blank" rel="noopener">${ic('globe','xs')}${d}</a>`).join('')}</div>`:''}${!m.pending&&!m.streaming&&m.memNew?`<div class="mem-chip">${ic('brain','sm')}<span>Memoria actualizada: «${esc(m.memNew.text)}»</span><button class="link-btn" data-action="undo-mem" data-i="${i}">Deshacer</button></div>`:''}${actions}</div>`;
}

function scrollThread(force){const t=$('#thread');if(!t)return;const near=t.scrollHeight-t.scrollTop-t.clientHeight<140;if(force||near)t.scrollTop=t.scrollHeight;}
function wireComposer(){
 const ta=$('#prompt');if(!ta)return;
 const size=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,220)+'px';};
 size();
 ta.addEventListener('input',()=>{U.draft=ta.value;size();syncSend();});
 ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&S.prefs.enterSend){e.preventDefault();send();}});
}
function sendKind(){if(U.streaming)return 'stop';const empty=!(U.draft||'').trim()&&!U.attachments.length;return empty&&!U.create&&!U.rec?'voice':'send';}
function sendBtnHTML(){
 const k=sendKind();
 if(k==='stop')return `<button type="button" class="send" data-kind="stop" data-action="stop" aria-label="Detener respuesta">${ic('stop')}</button>`;

const PREVIEW=(()=>{try{return !!(window.claude&&typeof window.claude.use==='function')||/(^|\.)claude(usercontent)?\.(ai|com)$/.test(location.hostname);}catch(e){return false;}})();

async function askServer(body,onEvent,signal){
 const a=S.admin.api;
 const res=await fetch(a.url.replace(/\/+$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Liminal-Key':a.key},body:JSON.stringify(body),signal});
 if(!res.ok){let msg=`El servidor respondió con un error (${res.status}).`;try{const j=await res.json();if(j&&j.message)msg=j.message;}catch(e){}throw new Error(msg);}
 if(!res.body)throw new Error('Este navegador no puede recibir la respuesta por partes.');
 const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
 for(;;){
  const {done,value}=await reader.read();if(done)break;
  buf+=dec.decode(value,{stream:true});let i;
  while((i=buf.indexOf('\n\n'))>=0){
   const block=buf.slice(0,i);buf=buf.slice(i+2);
   for(const line of block.split('\n')){if(!line.startsWith('data:'))continue;let ev;try{ev=JSON.parse(line.slice(5));}catch(e){continue;}if(ev.t==='error')throw new Error(ev.message||'Error del servidor.');onEvent(ev);}
  }
 }
}
async function askServerText(body,signal){let t='';await askServer(body,ev=>{if(ev.t==='text')t+=ev.d;},signal);return t.trim();}

/* A real answer, shown as it arrives. */
function streamFromServer(c,idx,bot,opts){
 const ctrl=new AbortController();U.abort=ctrl;
 const t0=Date.now();let think='',started=false,queued=false;
 bot.thought=opts.tier==='adv'?[]:null;bot.web=false;bot.sources=null;bot.thinking=0;
 const paint=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;updateMsg(c,idx);});};
 const body=Object.assign(profileForModel(c.mode||U.mode,false),{tier:opts.tier,effort:opts.effort,messages:historyForModel(c,idx)});
 askServer(body,ev=>{
  if(ctrl.signal.aborted)return;
  if(ev.t==='think'){think+=ev.d;if(bot.thought)bot.thought=thoughtLines(think);paint();}
  else if(ev.t==='text'){
   if(!started){started=true;bot.pending=false;bot.reading=false;bot.streaming=true;bot.thinking=opts.tier==='adv'&&think?Math.max(1,Math.round((Date.now()-t0)/1000)):0;if(opts.tracked)islaSet('Escribiendo la respuesta');}
   bot.text+=ev.d;paint();
  }
 },ctrl.signal).then(()=>{
  if(ctrl.signal.aborted)return;U.abort=null;
  if(!bot.text)bot.text='No llegó respuesta. Intenta de nuevo.';
  finishStream(c,idx);if(opts.tracked)islaDone('Respuesta lista',plainPreview(bot.text));
 }).catch(err=>{
  if(ctrl.signal.aborted)return;U.abort=null;
  bot.text=(bot.text?bot.text+'\n\n':'')+`**No se pudo completar la respuesta.** ${err&&err.message&&err.name!=='TypeError'?err.message:'Revisa tu conexión a internet o la dirección del servidor.'}`;
  bot.stopped=true;finishStream(c,idx);islaClear();

}

function openSearch(){
 modal(`<div class="search-bar">${ic('search')}<label class="sr" for="q">Buscar en tus chats</label><input id="q" class="search-input" placeholder="Buscar en tus chats" autocomplete="off"><button class="icon-btn" data-action="close-modal" aria-label="Cerrar">${ic('x')}</button></div><div class="search-res" id="sres"></div>`,{cls:'search-modal',label:'Buscar chats',onOpen:w=>{
  const q=w.querySelector('#q'),res=w.querySelector('#sres');
  const run=()=>{
   const s=q.value.trim().toLowerCase();const list=S.chats.filter(c=>!c.temp).sort((a,b)=>b.updated-a.updated);
   const hits=[];
   list.forEach(c=>{
    if(!s){hits.push({c,snip:rel(c.updated)});return;}
    const inTitle=c.title.toLowerCase().includes(s);let snip='';
    for(const m of c.messages){const k=m.text.toLowerCase().indexOf(s);if(k>=0){const a=Math.max(0,k-30);snip=(a?'…':'')+m.text.slice(a,k+s.length+50).replace(/[#*>`]/g,'');break;}}
    if(inTitle||snip)hits.push({c,snip:snip||rel(c.updated)});
   });
   const hl=t=>{const e=esc(t);if(!s)return e;return e.replace(new RegExp(esc(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),x=>`<mark>${x}</mark>`);};
   res.innerHTML=hits.length?hits.slice(0,12).map(h=>{const p=h.c.projectId?projById(h.c.projectId):null;return `<button class="sr-item" data-action="open-chat" data-id="${h.c.id}">${ic('chat')}<span style="min-width:0"><b>${hl(h.c.title)}</b><span>${p?esc(p.name)+' · ':''}${hl(h.snip)}</span></span></button>`;}).join(''):`<div class="sr-empty">No hay chats con «${esc(q.value)}».</div>`;
  };
  q.addEventListener('input',run);q.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=res.querySelector('.sr-item');if(f)f.click();}});run();
 }});
}

function copyText(text,ok='Copiado'){
 const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='absolute';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();let done=false;try{done=document.execCommand('copy');}catch(e){}ta.remove();toast(done?ok:'Selecciona el texto y cópialo manualmente');};
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast(ok),fallback);}else fallback();}catch(e){fallback();}
}

function afterPref(k){
 if(k==='prefs.tier'||k==='prefs.effort'||k==='prefs.advModel')renderTopbar();
 if(k==='prefs.defMode'&&U.view==='home'&&!(U.draft||'').trim())U.mode=S.prefs.defMode;
 if(k==='prefs.tempDefault'&&U.view!=='chat'){U.temp=S.prefs.tempDefault;renderTopbar();}
 if(k==='prefs.showThinking'&&U.view==='chat')renderChat();
 if(k==='prefs.plan')renderSidebar();
 if(k==='prefs.island')paintIsla();
 applyPrefs();save();renderSettings(true);
 const b=$(`[data-key="${k}"][aria-checked="true"]`);if(b&&!b.classList.contains('switch'))b.focus({preventScroll:true});
}

/* Events */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');
 const pop=$('.pop');
 if(pop&&!e.target.closest('.pop')&&(!el||el!==U.popAnchor))closePop();
 if(!el)return;
 const fn=A[el.dataset.action];if(fn){e.preventDefault();fn(el,e);}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,kind=f.dataset.form;
 if(kind==='login'){doLogin(f);return;}
 if(kind==='composer'){send();return;}
 if(kind==='voice-type'){const i=$('#v-input');const v=i?i.value.trim():'';if(!v||!V.on||V.phase==='thinking'||V.phase==='speaking')return;i.value='';V.note='';finishTurn(v);return;}
 if(kind==='rename-chat'){const v=f.elements.v.value.trim();if(!v)return;const c=chatById(f.dataset.id);c.title=v;save();closeModal();renderSidebar();renderTopbar();if(U.view==='project')renderProject();toast('Chat renombrado');return;}
 if(kind==='folder'){const v=f.elements.v.value.trim();if(!v)return;if(f.dataset.id){folderById(f.dataset.id).name=v;toast('Carpeta renombrada');}else{const id='f'+uid();S.folders.push({id,name:v});U.openFolders[id]=true;toast('Carpeta creada');}save();closeModal();renderSidebar();return;}
 if(kind==='project'){const name=f.elements.name.value.trim();if(!name)return;const desc=f.elements.desc.value.trim(),color=f.elements.color.value;closeModal();if(f.dataset.id){const p=projById(f.dataset.id);Object.assign(p,{name,desc,color});save();render();toast('Proyecto actualizado');}else{const p={id:'p'+uid(),name,desc,color,instructions:'',files:[],created:Date.now()};S.projects.push(p);save();go('project',p.id);toast('Proyecto creado');}return;}
 if(kind==='mem-add'){const v=f.elements.v.value.trim();if(!v)return;S.memories.push({id:uid(),text:v.charAt(0).toUpperCase()+v.slice(1),cat:f.elements.cat.value});save();renderSettings(true);toast('Lithium lo recordará');return;}
 if(kind==='mem-edit'){const v=f.elements.v.value.trim();const m=S.memories.find(x=>x.id===f.dataset.id);if(!v||!m)return;m.text=v;save();closeModal();openSettings('memoria');toast('Recuerdo actualizado');return;}
 if(kind==='mcp'){const name=f.elements.name.value.trim(),url=f.elements.url.value.trim();if(!name){toast('Ponle un nombre al conector.');return;}if(!/^https:\/\/[^\s]+\.[^\s]+/.test(url)){toast('La dirección tiene que empezar por https://');return;}S.customMcp.push({id:'m'+uid(),name,url,on:true});save();renderSettings(true);toast(`Agregaste ${name}`);return;}
 if(kind==='pay-pm'){const ref=f.elements.ref.value.replace(/\D/g,'');if(ref.length<4){toast('Escribe el número de referencia: al menos los últimos 4 dígitos.');f.elements.ref.focus();return;}addPayment('Pago Móvil · '+f.elements.bank.value,bs(payState().amountBs),ref);toast('Recibimos tu comprobante. Lo verificamos en minutos y activamos tu plan.');return;}
 if(kind==='pay-crypto'){const st=payState();addPayment(`${f.dataset.coin} · ${f.dataset.net}`,`${st.price} ${f.dataset.coin}`,f.elements.hash.value.trim().slice(0,16));toast('Gracias. En cuanto la red confirme el pago, activamos tu plan.');return;}
 if(kind==='move'){const c=chatById(f.dataset.id);c.projectId=f.elements.project.value||null;c.folderId=f.elements.folder.value||null;if(c.folderId)U.openFolders[c.folderId]=true;save();closeModal();render();toast('Chat movido');return;}
});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.ed-tools [data-action="ed-cmd"]'))e.preventDefault();});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.bind){setPath(S,el.dataset.bind,el.value);save();if(el.dataset.bind==='prefs.name'){renderSidebar();const g=$('.greet');if(g)g.textContent=`${greeting()}, ${S.prefs.name||'¿cómo te llamas?'}`;}}
 if(el.dataset.bindp){const p=projById(el.dataset.bindp);if(p){p.instructions=el.value;save();}}
 if(el.dataset.adminQ==='user'){U.userQuery=el.value;const pos=el.selectionStart;renderAdmin();const n=$('#uq');if(n){n.focus();n.setSelectionRange(pos,pos);}}
 if(el.dataset.adminText&&U.adminDraft){U.adminDraft[el.dataset.adminText]=el.value;}
 if(el.dataset.adminNum&&U.adminDraft){const v=parseFloat(el.value);if(!isNaN(v)&&v>=parseFloat(el.min)&&v<=parseFloat(el.max)){U.adminDraft[el.dataset.adminNum]=v;el.removeAttribute('aria-invalid');const ec=$('#econ');if(ec)ec.innerHTML=econHTML(U.adminDraft);}else el.setAttribute('aria-invalid','true');}
});
document.addEventListener('change',e=>{const el=e.target;if(el.tagName==='SELECT'&&el.dataset.bind){setPath(S,el.dataset.bind,el.value);afterPref(el.dataset.bind);}});
fileInput.addEventListener('change',()=>{
 const files=Array.from(fileInput.files||[]);fileInput.value='';if(!files.length)return;
 const size=b=>b>1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
 if(U.fileTarget==='project'&&U.view==='project'){const p=projById(U.projectId);files.forEach(f=>p.files.push({name:f.name,size:size(f.size)}));U.fileTarget=null;save();renderProject();toast(files.length>1?`Agregaste ${files.length} archivos`:`Agregaste ${files[0].name}`);return;}
 U.fileTarget=null;handleFiles(files);
});
cameraInput.addEventListener('change',()=>{const files=Array.from(cameraInput.files||[]);cameraInput.value='';if(files.length)handleFiles(files);});
scrim.addEventListener('click',closeSidebar);
document.addEventListener('keydown',e=>{
 if(!SESSION)return;
 const mod=e.metaKey||e.ctrlKey;
 if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return;}
 if(mod&&e.shiftKey&&e.key.toLowerCase()==='o'){e.preventDefault();newChat();return;}
 if(e.key==='Escape'&&V.on&&!V.min){endVoice();return;}
 if(e.key==='Escape'){if($('.pop')){const a=U.popAnchor;closePop();if(a)a.focus();}else if($('.backdrop'))closeModal();else if(sidebar.classList.contains('open'))closeSidebar();else if(U.streaming)stopStream();}
});
addEventListener('resize',()=>{if(innerWidth>860)closeSidebar();closePop();});
setInterval(()=>{if(!S||!SESSION)return;const before=S.usage.adv;checkUsage();if(S.usage.adv!==before){renderSidebar();save();}},60e3);

/* Boot */
SESSION=readSession();
if(SESSION)startApp();else showAuth(null,'');
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
